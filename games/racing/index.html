<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing - MattBread Arcade</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #08080d;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    overflow: hidden;
}

h1 {
    margin: 18px 0 5px;
    font-size: 38px;
}

#score {
    font-size: 20px;
    margin-bottom: 10px;
}

#game {
    position: relative;
    width: 360px;
    height: 620px;
    margin: 0 auto;
    background: #222;
    border: 4px solid #555;
    overflow: hidden;
}

.road {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to right,
            #555 0%,
            #555 8%,
            #222 8%,
            #222 92%,
            #555 92%,
            #555 100%
        );
}

.lane-line {
    position: absolute;
    width: 8px;
    height: 80px;
    background: white;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.8;
}

.car {
    position: absolute;
    width: 48px;
    height: 82px;
    border-radius: 10px;
    z-index: 5;
}

.player {
    background: #18a0ff;
    bottom: 30px;
    left: 156px;
    box-shadow: 0 0 12px #18a0ff;
}

.enemy {
    background: #ff3030;
    box-shadow: 0 0 12px #ff3030;
}

.window {
    position: absolute;
    width: 30px;
    height: 25px;
    left: 9px;
    top: 10px;
    background: #111;
    border-radius: 5px;
}

.wheel {
    position: absolute;
    width: 8px;
    height: 18px;
    background: #050505;
    top: 18px;
    border-radius: 3px;
}

.wheel.left {
    left: -5px;
}

.wheel.right {
    right: -5px;
}

.wheel.bottom {
    top: 48px;
}

#gameOver {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.82);
    display: none;
    z-index: 20;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

#gameOver h2 {
    font-size: 42px;
    margin: 10px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 13px 24px;
    margin: 7px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: #fff;
    color: #111;
}

button:hover {
    transform: scale(1.05);
}

.controls {
    margin: 12px auto;
}

.controls button {
    width: 75px;
    height: 52px;
    padding: 0;
    font-size: 24px;
}

#back {
    display: inline-block;
    color: white;
    text-decoration: none;
    margin-top: 5px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🏎️ Racing</h1>
<div id="score">Score: 0 | Best: 0</div>

<div id="game">
    <div class="road"></div>

    <div class="lane-line" style="top:0;"></div>
    <div class="lane-line" style="top:160px;"></div>
    <div class="lane-line" style="top:320px;"></div>
    <div class="lane-line" style="top:480px;"></div>

    <div id="player" class="car player">
        <div class="window"></div>
        <div class="wheel left"></div>
        <div class="wheel right"></div>
        <div class="wheel left bottom"></div>
        <div class="wheel right bottom"></div>
    </div>

    <div id="gameOver">
        <h2>GAME OVER</h2>
        <p id="finalScore"></p>
        <button onclick="restart()">Restart</button>
    </div>
</div>

<div class="controls">
    <button onclick="moveLeft()">⬅️</button>
    <button onclick="moveRight()">➡️</button>
</div>

<a id="back" href="../../index.html">← Back to Arcade</a>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

let playerX = 156;
let score = 0;
let best = Number(localStorage.getItem("racingBest")) || 0;
let speed = 4;
let running = true;
let enemies = [];

const lanes = [70, 156, 242];

function updateScore() {
    scoreText.textContent = `Score: ${score} | Best: ${best}`;
}

function moveLeft() {
    if (!running) return;

    const index = lanes.indexOf(playerX);

    if (index > 0) {
        playerX = lanes[index - 1];
        player.style.left = playerX + "px";
    }
}

function moveRight() {
    if (!running) return;

    const index = lanes.indexOf(playerX);

    if (index < lanes.length - 1) {
        playerX = lanes[index + 1];
        player.style.left = playerX + "px";
    }
}

document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        moveLeft();
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        moveRight();
    }
});

function createEnemy() {
    if (!running) return;

    const enemy = document.createElement("div");
    enemy.className = "car enemy";

    const lane = lanes[Math.floor(Math.random() * lanes.length)];

    enemy.style.left = lane + "px";
    enemy.style.top = "-100px";

    enemy.innerHTML = `
        <div class="window"></div>
        <div class="wheel left"></div>
        <div class="wheel right"></div>
        <div class="wheel left bottom"></div>
        <div class="wheel right bottom"></div>
    `;

    game.appendChild(enemy);

    enemies.push({
        element: enemy,
        x: lane,
        y: -100
    });
}

function collision(a, b) {
    return !(
        a.right < b.left ||
        a.left > b.right ||
        a.bottom < b.top ||
        a.top > b.bottom
    );
}

function gameLoop() {
    if (!running) return;

    enemies.forEach((enemy, index) => {
        enemy.y += speed;
        enemy.element.style.top = enemy.y + "px";

        const playerRect = player.getBoundingClientRect();
        const enemyRect = enemy.element.getBoundingClientRect();

        if (collision(playerRect, enemyRect)) {
            endGame();
        }

        if (enemy.y > 650) {
            enemy.element.remove();
            enemies.splice(index, 1);

            score++;

            if (score > best) {
                best = score;
                localStorage.setItem("racingBest", best);
            }

            if (score % 10 === 0) {
                speed += 0.5;
            }

            updateScore();
        }
    });

    requestAnimationFrame(gameLoop);
}

function endGame() {
    running = false;

    finalScore.textContent = `Score: ${score} | Best: ${best}`;
    gameOverScreen.style.display = "flex";
}

function restart() {
    enemies.forEach(enemy => enemy.element.remove());
    enemies = [];

    playerX = 156;
    player.style.left = playerX + "px";

    score = 0;
    speed = 4;
    running = true;

    gameOverScreen.style.display = "none";

    updateScore();
    requestAnimationFrame(gameLoop);
}

updateScore();

setInterval(() => {
    if (running && enemies.length < 4) {
        createEnemy();
    }
}, 1100);

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
