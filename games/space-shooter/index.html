<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter — MattBread Arcade</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #050510;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    .game-container {
        text-align: center;
        width: 100%;
        max-width: 900px;
        padding: 20px;
    }

    h1 {
        margin: 0 0 10px;
        font-size: 38px;
    }

    .stats {
        display: flex;
        justify-content: center;
        gap: 35px;
        margin-bottom: 15px;
        font-size: 18px;
    }

    canvas {
        width: 100%;
        max-width: 800px;
        height: auto;
        background: #020208;
        border: 2px solid #3333ff;
        border-radius: 12px;
        box-shadow: 0 0 25px rgba(60, 60, 255, 0.35);
        display: block;
        margin: auto;
    }

    .controls {
        margin-top: 15px;
        color: #aaa;
    }

    button {
        margin-top: 15px;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        background: #3333ff;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #5555ff;
    }

    #gameOver {
        display: none;
        margin-top: 15px;
        font-size: 24px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="game-container">

    <h1>🚀 Space Shooter</h1>

    <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
        <div>High Score: <span id="highScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="controls">
        ⬅️ ➡️ Move &nbsp;&nbsp; | &nbsp;&nbsp; Space = Shoot
    </div>

    <div id="gameOver">💥 Game Over!</div>

    <button onclick="restartGame()">Restart Game</button>

</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreDisplay = document.getElementById("score");
const livesDisplay = document.getElementById("lives");
const highScoreDisplay = document.getElementById("highScore");
const gameOverDisplay = document.getElementById("gameOver");

let score = 0;
let lives = 3;
let gameRunning = true;

let highScore = Number(localStorage.getItem("spaceShooterHighScore")) || 0;
highScoreDisplay.textContent = highScore;

const keys = {};

document.addEventListener("keydown", function(event) {
    keys[event.code] = true;

    if (event.code === "Space") {
        event.preventDefault();
    }
});

document.addEventListener("keyup", function(event) {
    keys[event.code] = false;
});

const player = {
    x: 375,
    y: 530,
    width: 50,
    height: 40,
    speed: 7
};

let bullets = [];
let enemies = [];
let stars = [];

for (let i = 0; i < 100; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        speed: 1 + Math.random() * 2,
        size: Math.random() * 2 + 1
    });
}

let enemyTimer = 0;
let shootCooldown = 0;

function drawStars() {
    ctx.fillStyle = "white";

    stars.forEach(star => {
        ctx.fillRect(star.x, star.y, star.size, star.size);

        star.y += star.speed;

        if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
        }
    });
}

function drawPlayer() {
    ctx.save();

    ctx.fillStyle = "#00eaff";
    ctx.beginPath();

    ctx.moveTo(player.x + player.width / 2, player.y);
    ctx.lineTo(player.x, player.y + player.height);
    ctx.lineTo(player.x + player.width, player.y + player.height);
    ctx.closePath();

    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(player.x + 21, player.y + 18, 8, 15);

    ctx.restore();
}

function drawBullets() {
    ctx.fillStyle = "#ffff00";

    bullets.forEach(bullet => {
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
    });
}

function drawEnemies() {
    enemies.forEach(enemy => {
        ctx.fillStyle = "#ff3366";

        ctx.beginPath();
        ctx.arc(
            enemy.x + enemy.width / 2,
            enemy.y + enemy.height / 2,
            enemy.width / 2,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "#111";

        ctx.fillRect(enemy.x + 8, enemy.y + 10, 6, 6);
        ctx.fillRect(enemy.x + 26, enemy.y + 10, 6, 6);
    });
}

function shoot() {
    if (shootCooldown > 0) return;

    bullets.push({
        x: player.x + player.width / 2 - 3,
        y: player.y,
        width: 6,
        height: 15,
        speed: 9
    });

    shootCooldown = 12;
}

function createEnemy() {
    const size = 35 + Math.random() * 15;

    enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        width: size,
        height: size,
        speed: 1.5 + Math.random() * 1.5 + score / 1000
    });
}

function collision(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function update() {
    if (!gameRunning) return;

    if (keys["ArrowLeft"] || keys["KeyA"]) {
        player.x -= player.speed;
    }

    if (keys["ArrowRight"] || keys["KeyD"]) {
        player.x += player.speed;
    }

    if (player.x < 0) {
        player.x = 0;
    }

    if (player.x + player.width > canvas.width) {
        player.x = canvas.width - player.width;
    }

    if (keys["Space"]) {
        shoot();
    }

    if (shootCooldown > 0) {
        shootCooldown--;
    }

    bullets.forEach(bullet => {
        bullet.y -= bullet.speed;
    });

    bullets = bullets.filter(bullet => bullet.y > -20);

    enemyTimer++;

    const spawnRate = Math.max(25, 70 - Math.floor(score / 100));

    if (enemyTimer >= spawnRate) {
        createEnemy();
        enemyTimer = 0;
    }

    enemies.forEach(enemy => {
        enemy.y += enemy.speed;
    });

    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];

        if (enemy.y > canvas.height) {
            enemies.splice(i, 1);
            lives--;

            livesDisplay.textContent = lives;

            if (lives <= 0) {
                endGame();
                return;
            }

            continue;
        }

        if (collision(player, enemy)) {
            enemies.splice(i, 1);
            lives--;

            livesDisplay.textContent = lives;

            if (lives <= 0) {
                endGame();
                return;
            }

            continue;
        }

        for (let j = bullets.length - 1; j >= 0; j--) {

            if (collision(bullets[j], enemy)) {

                bullets.splice(j, 1);
                enemies.splice(i, 1);

                score += 10;
                scoreDisplay.textContent = score;

                if (score > highScore) {
                    highScore = score;
                    highScoreDisplay.textContent = highScore;
                    localStorage.setItem(
                        "spaceShooterHighScore",
                        highScore
                    );
                }

                break;
            }
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawStars();
    drawPlayer();
    drawBullets();
    drawEnemies();
}

function gameLoop() {
    update();
    draw();

    requestAnimationFrame(gameLoop);
}

function endGame() {
    gameRunning = false;
    gameOverDisplay.style.display = "block";
}

function restartGame() {
    score = 0;
    lives = 3;

    scoreDisplay.textContent = score;
    livesDisplay.textContent = lives;

    bullets = [];
    enemies = [];

    player.x = 375;

    gameOverDisplay.style.display = "none";

    gameRunning = true;
}

gameLoop();
</script>

</body>
</html>
