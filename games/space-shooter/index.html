<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Space Shooter — MattBread Arcade</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050510;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game-container {
    width: 100%;
    max-width: 850px;
    padding: 20px;
    text-align: center;
}

h1 {
    margin: 0 0 12px;
    font-size: 38px;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 35px;
    margin-bottom: 15px;
    font-size: 18px;
}

canvas {
    width: 100%;
    max-width: 800px;
    height: auto;
    display: block;
    margin: auto;
    background: #020208;
    border: 2px solid #4444ff;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(60, 60, 255, 0.4);
}

.controls {
    margin-top: 15px;
    color: #aaa;
}

button {
    margin-top: 15px;
    padding: 12px 25px;
    border: 0;
    border-radius: 8px;
    background: #4444ff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #6666ff;
}

#gameOver {
    display: none;
    margin-top: 15px;
    font-size: 24px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="game-container">

    <h1>🚀 Space Shooter</h1>

    <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
        <div>High Score: <span id="highScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="controls">
        ⬅️ ➡️ Move &nbsp; | &nbsp; A / D Move &nbsp; | &nbsp; Space Shoot
    </div>

    <div id="gameOver">💥 GAME OVER!</div>

    <button onclick="restartGame()">Restart Game</button>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const livesElement = document.getElementById("lives");
const highScoreElement = document.getElementById("highScore");
const gameOverElement = document.getElementById("gameOver");

let score = 0;
let lives = 3;
let gameRunning = true;

let highScore = Number(localStorage.getItem("spaceShooterHighScore")) || 0;

highScoreElement.textContent = highScore;

const keys = {};

document.addEventListener("keydown", function(event) {

    keys[event.code] = true;

    if (event.code === "Space") {
        event.preventDefault();
    }

});

document.addEventListener("keyup", function(event) {

    keys[event.code] = false;

});


// =========================
// PLAYER
// =========================

const player = {
    x: 375,
    y: 530,
    width: 50,
    height: 40,
    speed: 7
};


// =========================
// GAME OBJECTS
// =========================

let bullets = [];
let enemies = [];
let stars = [];


// =========================
// STARS
// =========================

for (let i = 0; i < 80; i++) {

    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        speed: 1 + Math.random() * 2,
        size: 1 + Math.random() * 2
    });

}


// =========================
// TIMERS
// =========================

let enemyTimer = 0;
let shootTimer = 0;


// =========================
// DRAW STARS
// =========================

function drawStars() {

    ctx.fillStyle = "white";

    for (const star of stars) {

        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );

        star.y += star.speed;

        if (star.y > canvas.height) {

            star.y = 0;
            star.x = Math.random() * canvas.width;

        }

    }

}


// =========================
// DRAW PLAYER
// =========================

function drawPlayer() {

    ctx.fillStyle = "#00eaff";

    ctx.beginPath();

    ctx.moveTo(
        player.x + player.width / 2,
        player.y
    );

    ctx.lineTo(
        player.x,
        player.y + player.height
    );

    ctx.lineTo(
        player.x + player.width,
        player.y + player.height
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle = "white";

    ctx.fillRect(
        player.x + 21,
        player.y + 18,
        8,
        15
    );

}


// =========================
// DRAW BULLETS
// =========================

function drawBullets() {

    ctx.fillStyle = "#ffff00";

    for (const bullet of bullets) {

        ctx.fillRect(
            bullet.x,
            bullet.y,
            bullet.width,
            bullet.height
        );

    }

}


// =========================
// DRAW ENEMIES
// =========================

function drawEnemies() {

    for (const enemy of enemies) {

        ctx.fillStyle = "#ff3366";

        ctx.beginPath();

        ctx.arc(
            enemy.x + enemy.width / 2,
            enemy.y + enemy.height / 2,
            enemy.width / 2,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "#111";

        ctx.fillRect(
            enemy.x + 8,
            enemy.y + 10,
            6,
            6
        );

        ctx.fillRect(
            enemy.x + 26,
            enemy.y + 10,
            6,
            6
        );

    }

}


// =========================
// SHOOT
// =========================

function shoot() {

    if (shootTimer > 0) {
        return;
    }

    bullets.push({
        x: player.x + player.width / 2 - 3,
        y: player.y,
        width: 6,
        height: 15,
        speed: 10
    });

    shootTimer = 12;

}


// =========================
// CREATE ENEMY
// =========================

function createEnemy() {

    const size = 35;

    enemies.push({

        x: Math.random() * (canvas.width - size),

        y: -size,

        width: size,

        height: size,

        speed: 2 + Math.random() * 1.5

    });

}


// =========================
// COLLISION
// =========================

function isColliding(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );

}


// =========================
// UPDATE GAME
// =========================

function updateGame() {

    if (!gameRunning) {
        return;
    }


    // PLAYER MOVEMENT

    if (keys["ArrowLeft"] || keys["KeyA"]) {

        player.x -= player.speed;

    }

    if (keys["ArrowRight"] || keys["KeyD"]) {

        player.x += player.speed;

    }


    // KEEP PLAYER ON SCREEN

    if (player.x < 0) {

        player.x = 0;

    }

    if (player.x + player.width > canvas.width) {

        player.x = canvas.width - player.width;

    }


    // SHOOT

    if (keys["Space"]) {

        shoot();

    }


    if (shootTimer > 0) {

        shootTimer--;

    }


    // MOVE BULLETS

    for (const bullet of bullets) {

        bullet.y -= bullet.speed;

    }


    // REMOVE OFFSCREEN BULLETS

    bullets = bullets.filter(function(bullet) {

        return bullet.y > -30;

    });


    // CREATE ENEMIES

    enemyTimer++;

    if (enemyTimer >= 55) {

        createEnemy();

        enemyTimer = 0;

    }


    // MOVE ENEMIES

    for (const enemy of enemies) {

        enemy.y += enemy.speed;

    }


    // ENEMY / PLAYER COLLISION

    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];

        if (isColliding(player, enemy)) {

            enemies.splice(i, 1);

            loseLife();

            continue;

        }


        // ENEMY REACHED BOTTOM

        if (enemy.y > canvas.height) {

            enemies.splice(i, 1);

            loseLife();

            continue;

        }

    }


    // BULLET / ENEMY COLLISIONS

    for (let b = bullets.length - 1; b >= 0; b--) {

        let bullet = bullets[b];
        let hit = false;

        for (let e = enemies.length - 1; e >= 0; e--) {

            let enemy = enemies[e];

            if (isColliding(bullet, enemy)) {

                bullets.splice(b, 1);

                enemies.splice(e, 1);

                score += 10;

                updateScore();

                hit = true;

                break;

            }

        }

        if (hit) {
            continue;
        }

    }

}


// =========================
// LOSE LIFE
// =========================

function loseLife() {

    lives--;

    livesElement.textContent = lives;

    if (lives <= 0) {

        endGame();

    }

}


// =========================
// UPDATE SCORE
// =========================

function updateScore() {

    scoreElement.textContent = score;

    if (score > highScore) {

        highScore = score;

        highScoreElement.textContent = highScore;

        localStorage.setItem(
            "spaceShooterHighScore",
            highScore
        );

    }

}


// =========================
// GAME OVER
// =========================

function endGame() {

    gameRunning = false;

    gameOverElement.style.display = "block";

}


// =========================
// RESTART
// =========================

function restartGame() {

    score = 0;

    lives = 3;

    bullets = [];

    enemies = [];

    player.x = 375;

    enemyTimer = 0;

    shootTimer = 0;

    gameRunning = true;

    scoreElement.textContent = "0";

    livesElement.textContent = "3";

    gameOverElement.style.display = "none";

}


// =========================
// DRAW
// =========================

function drawGame() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawStars();

    drawPlayer();

    drawBullets();

    drawEnemies();

}


// =========================
// GAME LOOP
// =========================

function gameLoop() {

    updateGame();

    drawGame();

    requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
