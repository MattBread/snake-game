<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tetris - MattBread Arcade</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #18234d 0%, #090b18 50%, #05060d 100%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
}

.wrapper {
    width: min(900px, 100%);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.title {
    font-size: 28px;
    font-weight: bold;
}

.stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.stat {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 8px 12px;
    font-weight: bold;
    font-size: 14px;
}

.game-area {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 18px;
}

canvas {
    display: block;
    width: min(360px, 82vw);
    height: auto;
    background: #070a17;
    border: 2px solid rgba(125,211,252,0.35);
    border-radius: 14px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        0 0 30px rgba(125,211,252,0.08);
    touch-action: none;
}

.side {
    width: 170px;
}

.panel {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 12px;
}

.panel h3 {
    margin: 0 0 10px;
    font-size: 16px;
}

.next-box {
    width: 130px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#next {
    width: 120px;
    height: 90px;
}

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
}

button {
    border: 1px solid rgba(125,211,252,0.25);
    background: rgba(125,211,252,0.12);
    color: #7dd3fc;
    padding: 10px 13px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: rgba(125,211,252,0.22);
}

.controls {
    color: #999;
    font-size: 13px;
    line-height: 1.7;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(3,5,12,0.75);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.overlay-box {
    width: min(420px, 90%);
    text-align: center;
    padding: 35px;
    border-radius: 22px;
    background:
        linear-gradient(
            145deg,
            rgba(30,40,80,0.97),
            rgba(8,10,25,0.97)
        );
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 25px 80px rgba(0,0,0,0.5);
}

.overlay h1 {
    font-size: 38px;
    margin: 0 0 10px;
}

.overlay p {
    color: #aaa;
    line-height: 1.6;
}

.hidden {
    display: none;
}

.mobile-controls {
    display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.mobile-controls button {
    font-size: 20px;
    padding: 12px 5px;
}

@media(max-width:700px) {

    .game-area {
        flex-direction: column;
        align-items: center;
    }

    .side {
        width: min(360px, 82vw);
    }

    .panel {
        display: none;
    }

    .mobile-controls {
        display: grid;
    }

    .header {
        justify-content: center;
    }

    .title {
        width: 100%;
        text-align: center;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="header">

        <div class="title">
            🧩 Tetris
        </div>

        <div class="stats">

            <div class="stat">
                Score: <span id="score">0</span>
            </div>

            <div class="stat">
                Best: <span id="best">0</span>
            </div>

            <div class="stat">
                Level: <span id="level">1</span>
            </div>

        </div>

    </div>


    <div class="game-area">

        <div>

            <canvas
                id="game"
                width="300"
                height="600">
            </canvas>

            <div class="mobile-controls">

                <button onclick="move(-1)">
                    ◀
                </button>

                <button onclick="rotate()">
                    🔄
                </button>

                <button onclick="softDrop()">
                    ▼
                </button>

                <button onclick="move(1)">
                    ▶
                </button>

            </div>

        </div>


        <div class="side">

            <div class="panel">

                <h3>Next Piece</h3>

                <div class="next-box">

                    <canvas
                        id="next"
                        width="120"
                        height="90">
                    </canvas>

                </div>

            </div>


            <div class="panel">

                <h3>Controls</h3>

                <div class="controls">

                    ← → Move<br>
                    ↑ Rotate<br>
                    ↓ Soft Drop<br>
                    Space Hard Drop<br>
                    P Pause

                </div>

            </div>


            <div class="buttons">

                <button onclick="togglePause()">
                    ⏸ Pause
                </button>

                <button onclick="restart()">
                    🔄 Restart
                </button>

                <button onclick="goHome()">
                    🏠 Arcade
                </button>

            </div>

        </div>

    </div>

</div>


<div id="overlay" class="overlay">

    <div class="overlay-box">

        <h1 id="overlayTitle">
            🧩 Tetris
        </h1>

        <p id="overlayText">
            Stack the blocks and clear lines!
        </p>

        <button onclick="startGame()">
            ▶ Start Game
        </button>

    </div>

</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const nextCanvas =
    document.getElementById("next");

const nextCtx =
    nextCanvas.getContext("2d");


/* =========================
   BOARD
========================= */

const COLS = 10;
const ROWS = 20;
const SIZE = 30;

let board;


/* =========================
   COLORS
========================= */

const colors = {

    I: "#38bdf8",
    O: "#facc15",
    T: "#c084fc",
    S: "#4ade80",
    Z: "#fb7185",
    J: "#60a5fa",
    L: "#fb923c"

};


/* =========================
   PIECES
========================= */

const pieces = {

    I: [
        [1,1,1,1]
    ],

    O: [
        [1,1],
        [1,1]
    ],

    T: [
        [0,1,0],
        [1,1,1]
    ],

    S: [
        [0,1,1],
        [1,1,0]
    ],

    Z: [
        [1,1,0],
        [0,1,1]
    ],

    J: [
        [1,0,0],
        [1,1,1]
    ],

    L: [
        [0,0,1],
        [1,1,1]
    ]

};

const pieceTypes =
    Object.keys(pieces);


/* =========================
   GAME STATE
========================= */

let current;
let nextPiece;

let score = 0;
let best =
    Number(localStorage.getItem("tetrisBest")) || 0;

let level = 1;

let lines = 0;

let running = false;
let paused = false;

let dropCounter = 0;
let lastTime = 0;


/* =========================
   DOM
========================= */

const scoreEl =
    document.getElementById("score");

const bestEl =
    document.getElementById("best");

const levelEl =
    document.getElementById("level");

const overlay =
    document.getElementById("overlay");

const overlayTitle =
    document.getElementById("overlayTitle");

const overlayText =
    document.getElementById("overlayText");


bestEl.textContent = best;


/* =========================
   CREATE BOARD
========================= */

function createBoard() {

    board =
        Array.from(
            { length: ROWS },
            () => Array(COLS).fill(0)
        );

}


/* =========================
   RANDOM PIECE
========================= */

function randomPiece() {

    const type =
        pieceTypes[
            Math.floor(
                Math.random() *
                pieceTypes.length
            )
        ];

    return {

        type,

        matrix:
            pieces[type].map(
                row => [...row]
            ),

        x:
            Math.floor(
                COLS / 2 -
                pieces[type][0].length / 2
            ),

        y: 0

    };

}


/* =========================
   COLLISION
========================= */

function collision(piece) {

    for (
        let y = 0;
        y < piece.matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < piece.matrix[y].length;
            x++
        ) {

            if (!piece.matrix[y][x])
                continue;

            const newX =
                piece.x + x;

            const newY =
                piece.y + y;

            if (
                newX < 0 ||
                newX >= COLS ||
                newY >= ROWS
            ) {

                return true;

            }

            if (
                newY >= 0 &&
                board[newY][newX]
            ) {

                return true;

            }

        }

    }

    return false;

}


/* =========================
   MERGE PIECE
========================= */

function merge() {

    current.matrix.forEach(
        (row, y) => {

            row.forEach(
                (value, x) => {

                    if (value) {

                        board[
                            current.y + y
                        ][
                            current.x + x
                        ] =
                            current.type;

                    }

                }
            );

        }
    );

}


/* =========================
   CLEAR LINES
========================= */

function clearLines() {

    let cleared = 0;

    outer:
    for (
        let y = ROWS - 1;
        y >= 0;
        y--
    ) {

        for (
            let x = 0;
            x < COLS;
            x++
        ) {

            if (!board[y][x]) {

                continue outer;

            }

        }

        board.splice(y, 1);

        board.unshift(
            Array(COLS).fill(0)
        );

        cleared++;

        y++;

    }


    if (cleared > 0) {

        lines += cleared;

        const points = {

            1: 100,
            2: 300,
            3: 500,
            4: 800

        };

        score +=
            (points[cleared] || 800) *
            level;


        level =
            Math.floor(lines / 10) + 1;


        scoreEl.textContent =
            score;

        levelEl.textContent =
            level;


        if (score > best) {

            best = score;

            localStorage.setItem(
                "tetrisBest",
                best
            );

            bestEl.textContent =
                best;

        }

    }

}


/* =========================
   DROP
========================= */

function drop() {

    current.y++;

    if (
        collision(current)
    ) {

        current.y--;

        merge();

        clearLines();

        current =
            nextPiece;

        nextPiece =
            randomPiece();

        drawNext();


        if (
            collision(current)
        ) {

            endGame();

        }

    }

    dropCounter = 0;

}


/* =========================
   SOFT DROP
========================= */

function softDrop() {

    if (!running || paused)
        return;

    current.y++;

    if (
        collision(current)
    ) {

        current.y--;

        drop();

    }

    dropCounter = 0;

}


/* =========================
   HARD DROP
========================= */

function hardDrop() {

    if (!running || paused)
        return;

    let distance = 0;

    while (!collision(current)) {

        current.y++;

        distance++;

    }

    current.y--;

    distance--;

    score +=
        Math.max(0, distance) * 2;

    scoreEl.textContent =
        score;

    if (score > best) {

        best = score;

        localStorage.setItem(
            "tetrisBest",
            best
        );

        bestEl.textContent =
            best;

    }

    drop();

}


/* =========================
   MOVE
========================= */

function move(direction) {

    if (!running || paused)
        return;

    current.x += direction;

    if (
        collision(current)
    ) {

        current.x -= direction;

    }

}


/* =========================
   ROTATE
========================= */

function rotate() {

    if (!running || paused)
        return;

    const oldMatrix =
        current.matrix;

    const oldX =
        current.x;


    const matrix =
        current.matrix.map(
            (_, index) =>
                current.matrix.map(
                    row =>
                        row[index]
                ).reverse()
        );


    current.matrix =
        matrix;


    if (
        collision(current)
    ) {

        current.x++;

        if (
            collision(current)
        ) {

            current.x =
                oldX - 1;

            if (
                collision(current)
            ) {

                current.matrix =
                    oldMatrix;

                current.x =
                    oldX;

            }

        }

    }

}


/* =========================
   DRAW CELL
========================= */

function drawCell(
    context,
    x,
    y,
    color,
    size
) {

    context.fillStyle =
        color;

    context.fillRect(
        x * size,
        y * size,
        size,
        size
    );


    context.strokeStyle =
        "rgba(255,255,255,0.18)";

    context.lineWidth = 1;

    context.strokeRect(
        x * size,
        y * size,
        size,
        size
    );


    context.fillStyle =
        "rgba(255,255,255,0.15)";

    context.fillRect(
        x * size + 4,
        y * size + 4,
        size - 8,
        3
    );

}


/* =========================
   DRAW BOARD
========================= */

function drawBoard() {

    ctx.fillStyle =
        "#070a17";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* grid */

    ctx.strokeStyle =
        "rgba(255,255,255,0.035)";

    for (
        let x = 0;
        x <= COLS;
        x++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x * SIZE,
            0
        );

        ctx.lineTo(
            x * SIZE,
            canvas.height
        );

        ctx.stroke();

    }


    for (
        let y = 0;
        y <= ROWS;
        y++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y * SIZE
        );

        ctx.lineTo(
            canvas.width,
            y * SIZE
        );

        ctx.stroke();

    }


    board.forEach(
        (row, y) => {

            row.forEach(
                (type, x) => {

                    if (type) {

                        drawCell(
                            ctx,
                            x,
                            y,
                            colors[type],
                            SIZE
                        );

                    }

                }
            );

        }
    );


    if (current) {

        current.matrix.forEach(
            (row, y) => {

                row.forEach(
                    (value, x) => {

                        if (value) {

                            drawCell(
                                ctx,
                                current.x + x,
                                current.y + y,
                                colors[current.type],
                                SIZE
                            );

                        }

                    }
                );

            }
        );

    }

}


/* =========================
   DRAW NEXT
========================= */

function drawNext() {

    nextCtx.fillStyle =
        "#070a17";

    nextCtx.fillRect(
        0,
        0,
        nextCanvas.width,
        nextCanvas.height
    );


    if (!nextPiece)
        return;


    const matrix =
        nextPiece.matrix;

    const size = 22;

    const width =
        matrix[0].length * size;

    const height =
        matrix.length * size;

    const offsetX =
        (nextCanvas.width - width) / 2;

    const offsetY =
        (nextCanvas.height - height) / 2;


    matrix.forEach(
        (row, y) => {

            row.forEach(
                (value, x) => {

                    if (!value)
                        return;

                    nextCtx.fillStyle =
                        colors[nextPiece.type];

                    nextCtx.fillRect(
                        offsetX +
                        x * size,
                        offsetY +
                        y * size,
                        size,
                        size
                    );

                    nextCtx.strokeStyle =
                        "rgba(255,255,255,0.18)";

                    nextCtx.strokeRect(
                        offsetX +
                        x * size,
                        offsetY +
                        y * size,
                        size,
                        size
                    );

                }
            );

        }
    );

}


/* =========================
   GAME LOOP
========================= */

function update(time = 0) {

    if (!running)
        return;


    const delta =
        time - lastTime;

    lastTime = time;


    if (!paused) {

        dropCounter += delta;


        const speed =
            Math.max(
                90,
                800 -
                (level - 1) * 70
            );


        if (
            dropCounter > speed
        ) {

            drop();

        }


        drawBoard();

    }


    requestAnimationFrame(update);

}


/* =========================
   START
========================= */

function startGame() {

    createBoard();

    score = 0;
    level = 1;
    lines = 0;

    scoreEl.textContent =
        score;

    levelEl.textContent =
        level;


    current =
        randomPiece();

    nextPiece =
        randomPiece();

    drawNext();


    running = true;
    paused = false;

    overlay.classList.add(
        "hidden"
    );


    lastTime =
        performance.now();

    dropCounter = 0;

    requestAnimationFrame(update);

}


/* =========================
   RESTART
========================= */

function restart() {

    startGame();

}


/* =========================
   PAUSE
========================= */

function togglePause() {

    if (!running)
        return;

    paused = !paused;

}


/* =========================
   GAME OVER
========================= */

function endGame() {

    running = false;

    overlayTitle.textContent =
        "💥 Game Over";

    overlayText.textContent =
        "Score: " +
        score +
        " • Best: " +
        best;

    overlay.classList.remove(
        "hidden"
    );

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            move(-1);

        }


        else if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            move(1);

        }


        else if (
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

            softDrop();

        }


        else if (
            event.key === "ArrowUp"
        ) {

            event.preventDefault();

            rotate();

        }


        else if (
            event.code === "Space"
        ) {

            event.preventDefault();

            hardDrop();

        }


        else if (
            event.key.toLowerCase() === "p"
        ) {

            togglePause();

        }

    }
);


/* =========================
   HOME
========================= */

function goHome() {

    window.location.href =
        "../../";

}


/* =========================
   INITIAL DRAW
========================= */

createBoard();

drawBoard();

drawNext();

</script>

</body>
</html>
