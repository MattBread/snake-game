
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Escape | MattBread Arcade</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090e19;color:#fff;font-family:Arial,sans-serif;text-align:center}
header{padding:12px;background:#111d31;border-bottom:2px solid #31d9ff}
h1{margin:4px;color:#50e8ff}
#stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;padding:12px;font-weight:bold}
#game{display:block;width:min(900px,96vw);height:auto;margin:0 auto;background:#172334;border:3px solid #3a627f;image-rendering:pixelated}
#controls{padding:12px;color:#c5d8eb;font-size:14px}
button{border:0;border-radius:8px;padding:12px 20px;margin:5px;background:#16bad5;color:#06121c;font-weight:bold;font-size:15px;cursor:pointer}
button:hover{background:#80f1ff}
#message{font-weight:bold;color:#ffe18a;min-height:24px;padding:8px}
a{color:#67eaff}
</style>
</head>
<body>
<header>
<h1>⚔️ DUNGEON ESCAPE</h1>
<div>MattBread Arcade</div>
</header>
<div id="stats">
<span>❤️ Health: <b id="health">100</b></span>
<span>⭐ Points: <b id="points">0</b></span>
<span>👹 Monsters: <b id="count">0</b></span>
</div>
<canvas id="game" width="800" height="500"></canvas>
<div id="message">Find the exit. Defeat monsters. Survive the dungeon!</div>
<div id="controls">Move: WASD or Arrow Keys · Attack: Space · Restart: R</div>
<button id="start">START GAME</button>
<button id="restart">RESTART</button>
<p><a href="../../../">← Back to MattBread Arcade</a></p>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const healthEl=document.getElementById("health");
const pointsEl=document.getElementById("points");
const countEl=document.getElementById("count");
const message=document.getElementById("message");
const startBtn=document.getElementById("start");
const tile=40,cols=20,rows=12;
let keys={},player,monsters,points,health,running,finished,lastAttack,exit;
const map=[
"####################",
"#........#.........#",
"#.####...#..####...#",
"#....#......#......#",
"###..#.####.#..###..#",
"#....#....#.#.......#",
"#.######..#..#####..#",
"#...........#.......#",
"#..####.....#..###..#",
"#.....#.............#",
"#.............#....E#",
"####################"
];
function wall(x,y){
 const c=Math.floor(x/tile),r=Math.floor(y/tile);
 return r<0||r>=rows||c<0||c>=cols||map[r][c]==="#";
}
function reset(){
 player={x:60,y:60,size:24,speed:2.6,faceX:1,faceY:0};
 monsters=[
 {x:260,y:100,hp:2},
 {x:500,y:140,hp:2},
 {x:340,y:300,hp:2},
 {x:620,y:380,hp:2},
 {x:180,y:420,hp:2}
 ];
 points=0;health=100;running=false;finished=false;lastAttack=0;
 exit={x:740,y:420};
 updateStats();draw();
 message.textContent="Press START GAME to enter the dungeon.";
 startBtn.textContent="START GAME";
}
function updateStats(){
 healthEl.textContent=health;
 pointsEl.textContent=points;
 countEl.textContent=monsters.length;
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const x=c*tile,y=r*tile;
  ctx.fillStyle=map[r][c]==="#"?"#39495c":"#172536";
  ctx.fillRect(x,y,tile,tile);
  ctx.strokeStyle="#26384a";ctx.strokeRect(x,y,tile,tile);
  if(map[r][c]==="#"){
   ctx.fillStyle="#52667a";ctx.fillRect(x+4,y+4,tile-8,4);
  }
 }
 ctx.fillStyle="#35f3a1";ctx.fillRect(exit.x-14,exit.y-14,28,28);
 ctx.fillStyle="#071b17";ctx.font="bold 19px Arial";ctx.fillText("E",exit.x-6,exit.y+7);
 for(const m of monsters){
  ctx.fillStyle="#ff496c";ctx.fillRect(m.x-13,m.y-13,26,26);
  ctx.fillStyle="#fff";ctx.fillRect(m.x-7,m.y-5,4,4);ctx.fillRect(m.x+3,m.y-5,4,4);
  ctx.fillStyle="#ffb4c2";ctx.fillRect(m.x-10,m.y-19,20,3);
 }
 if(player){
  ctx.fillStyle="#57ddff";ctx.fillRect(player.x-12,player.y-12,24,24);
  ctx.fillStyle="#fff";ctx.fillRect(player.x+(player.faceX*5)-3,player.y+(player.faceY*5)-3,6,6);
 }
 if(!running&&!finished){
  ctx.fillStyle="#0009";ctx.fillRect(150,170,500,130);
  ctx.fillStyle="#fff";ctx.font="bold 30px Arial";ctx.fillText("DUNGEON ESCAPE",240,220);
  ctx.font="17px Arial";ctx.fillText("Press START GAME below",285,260);
 }
 if(finished){
  ctx.fillStyle="#000b";ctx.fillRect(130,170,540,130);
  ctx.fillStyle=health>0?"#70ffb0":"#ff7187";
  ctx.font="bold 30px Arial";ctx.fillText(health>0?"DUNGEON CLEARED!":"YOU WERE DEFEATED",205,225);
  ctx.fillStyle="#fff";ctx.font="18px Arial";ctx.fillText("Points: "+points+" — Press RESTART",245,265);
 }
}
function blocked(x,y){
 return [[x-10,y-10],[x+10,y-10],[x-10,y+10],[x+10,y+10]].some(p=>wall(p[0],p[1]));
}
function attack(){
 const now=performance.now();
 if(now-lastAttack<350)return;
 lastAttack=now;
 let hit=null,best=48;
 for(const m of monsters){
  const dx=m.x-player.x,dy=m.y-player.y;
  const forward=dx*player.faceX+dy*player.faceY;
  const side=Math.abs(dx*player.faceY-dy*player.faceX);
  if(forward>0&&forward<best&&side<27){hit=m;best=forward;}
 }
 if(hit){
  hit.hp--;message.textContent="Hit! Keep fighting!";
  if(hit.hp<=0){monsters=monsters.filter(m=>m!==hit);points+=100;message.textContent="Monster defeated! +100 points";}
 }else message.textContent="Swing! Get closer and face a monster.";
 updateStats();
}
function finish(win){
 running=false;finished=true;
 message.textContent=win?"You escaped the dungeon!":"You have fallen. Try again!";
 startBtn.textContent="PLAY AGAIN";draw();
}
function loop(){
 if(!running)return;
 let dx=0,dy=0;
 if(keys.ArrowLeft||keys.KeyA)dx--;
 if(keys.ArrowRight||keys.KeyD)dx++;
 if(keys.ArrowUp||keys.KeyW)dy--;
 if(keys.ArrowDown||keys.KeyS)dy++;
 if(dx||dy){
  const len=Math.hypot(dx,dy);dx=dx/len*player.speed;dy=dy/len*player.speed;
  if(dx){player.faceX=Math.sign(dx);player.faceY=0;}
  else if(dy){player.faceX=0;player.faceY=Math.sign(dy);}
  if(!blocked(player.x+dx,player.y))player.x+=dx;
  if(!blocked(player.x,player.y+dy))player.y+=dy;
 }
 for(const m of monsters){
  const vx=player.x-m.x,vy=player.y-m.y,d=Math.hypot(vx,vy);
  if(d>20){
   const mx=vx/d*0.65,my=vy/d*0.65;
   if(!blocked(m.x+mx,m.y))m.x+=mx;
   if(!blocked(m.x,m.y+my))m.y+=my;
  }else if(Math.random()<0.025){
   health-=5;message.textContent="A monster hit you!";
   updateStats();
   if(health<=0){health=0;updateStats();finish(false);return;}
  }
 }
 if(Math.hypot(player.x-exit.x,player.y-exit.y)<25&&monsters.length===0){
  points+=250;updateStats();finish(true);return;
 }
 draw();
 requestAnimationFrame(loop);
}
document.getElementById("start").addEventListener("click",()=>{
 if(finished)reset();
 running=true;finished=false;startBtn.textContent="GAME RUNNING";
 message.textContent="Defeat every monster, then reach the green exit!";
 loop();
});
document.getElementById("restart").addEventListener("click",reset);
document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
 if(e.code==="Space"&&running)attack();
 if(e.code==="KeyR")reset();
});
document.addEventListener("keyup",e=>keys[e.code]=false);
reset();
})();
</script>
</body>
</html>
