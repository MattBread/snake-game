<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeon Escape - MattBread Arcade</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#050506;
    color:#eee;
    font-family:Georgia,"Times New Roman",serif;
    text-align:center;
}

h1{
    margin:10px 0 4px;
    color:#d8c5a0;
    text-shadow:0 0 12px #000;
}

#hud{
    width:900px;
    max-width:96vw;
    margin:auto;
    display:flex;
    justify-content:space-between;
    padding:7px 12px;
    font-weight:bold;
}

#game{
    position:relative;
    width:900px;
    height:650px;
    max-width:96vw;
    max-height:70vh;
    margin:auto;
    overflow:hidden;
    background:#0c0b0e;
    border:5px solid #463d3a;
    box-shadow:inset 0 0 100px #000,0 0 30px #000;
}

#world{
    position:absolute;
    width:1800px;
    height:1300px;
    left:0;
    top:0;
}

.floor{
    position:absolute;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:48px 48px;
    background-color:#181519;
}

.room{
    position:absolute;
    background:#211e22;
    border:12px solid #423b3b;
    box-shadow:inset 0 0 45px #000;
}

.roomLabel{
    position:absolute;
    color:#655d5b;
    font-size:18px;
    letter-spacing:3px;
    pointer-events:none;
}

.corridor{
    position:absolute;
    background:#161318;
    border:6px solid #342e31;
    box-shadow:inset 0 0 30px #000;
}

.wall{
    position:absolute;
    background:linear-gradient(#40393a,#211e20);
    border:3px solid #554b4c;
    box-shadow:inset 0 0 12px #000;
}

.door{
    position:absolute;
    background:#5a432c;
    border:4px solid #8b7049;
    z-index:4;
}

.torch{
    position:absolute;
    width:18px;
    height:34px;
    background:#4b3020;
    border-radius:5px;
    z-index:6;
}

.torch:before{
    content:"";
    position:absolute;
    width:20px;
    height:25px;
    left:-1px;
    top:-18px;
    border-radius:50%;
    background:#ff9d28;
    box-shadow:0 0 12px #ff7a00,0 0 30px #ff5a00;
}

.exit{
    position:absolute;
    width:55px;
    height:65px;
    background:#15100d;
    border:5px solid #80653e;
    box-shadow:0 0 15px #80653e;
    z-index:5;
}

.exit:before{
    content:"EXIT";
    position:absolute;
    top:-22px;
    left:10px;
    color:#d8b56b;
    font-size:10px;
}

.chest{
    position:absolute;
    width:42px;
    height:32px;
    background:#754719;
    border:4px solid #b77a32;
    border-radius:5px;
    z-index:5;
}

.chest:after{
    content:"";
    position:absolute;
    width:7px;
    height:9px;
    background:#e1c15b;
    left:14px;
    top:9px;
}

.player{
    position:absolute;
    width:34px;
    height:46px;
    z-index:20;
}

.player .head{
    position:absolute;
    width:20px;
    height:20px;
    left:7px;
    border-radius:50%;
    background:#b88965;
    border:2px solid #674b3b;
}

.player .helmet{
    position:absolute;
    width:24px;
    height:9px;
    left:5px;
    background:#171b20;
    border-radius:8px 8px 2px 2px;
    z-index:2;
}

.player .body{
    position:absolute;
    width:30px;
    height:25px;
    left:2px;
    top:17px;
    background:#303d4a;
    border:2px solid #17202a;
    border-radius:7px;
}

.player .eye{
    position:absolute;
    width:4px;
    height:4px;
    background:#e8d6b2;
    left:18px;
    top:9px;
    z-index:4;
}

.player .leg{
    position:absolute;
    width:8px;
    height:12px;
    background:#191b20;
    top:39px;
}

.player .leg.left{left:6px}
.player .leg.right{right:6px}

.enemy{
    position:absolute;
    width:34px;
    height:45px;
    z-index:15;
}

.enemy .head{
    position:absolute;
    width:21px;
    height:21px;
    left:6px;
    border-radius:50%;
    background:#75655d;
    border:2px solid #332b29;
}

.enemy .body{
    position:absolute;
    width:30px;
    height:24px;
    left:2px;
    top:18px;
    background:#572d2d;
    border:2px solid #291515;
    border-radius:7px;
}

.enemy .eye{
    position:absolute;
    width:5px;
    height:5px;
    background:#ff3030;
    border-radius:50%;
    top:8px;
    left:9px;
    box-shadow:8px 0 0 #ff3030;
    z-index:4;
}

.enemy.archer .body{background:#31513a}
.enemy.knight .body{background:#424852}

.boss{
    position:absolute;
    width:70px;
    height:88px;
    z-index:18;
}

.boss .head{
    position:absolute;
    width:43px;
    height:43px;
    left:14px;
    border-radius:50%;
    background:#4c3434;
    border:4px solid #201315;
}

.boss .body{
    position:absolute;
    width:62px;
    height:48px;
    left:4px;
    top:35px;
    background:#43191f;
    border:4px solid #211014;
    border-radius:12px;
}

.boss .eye{
    position:absolute;
    width:8px;
    height:8px;
    background:#ff3030;
    border-radius:50%;
    top:15px;
    left:18px;
    box-shadow:0 0 7px #f00,16px 0 7px #f00;
    z-index:5;
}

.boss .horn{
    position:absolute;
    width:13px;
    height:23px;
    background:#c3b9a5;
    top:-12px;
}

.boss .horn.left{
    left:10px;
    transform:rotate(-28deg);
}

.boss .horn.right{
    right:10px;
    transform:rotate(28deg);
}

.boss .leg{
    position:absolute;
    width:14px;
    height:20px;
    background:#171012;
    top:72px;
}

.boss .leg.left{left:13px}
.boss .leg.right{right:13px}

.coin{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#c89b32;
    border:2px solid #f2d16a;
    box-shadow:0 0 10px #c89b32;
    z-index:7;
}

.potion{
    position:absolute;
    width:18px;
    height:23px;
    background:#8d2525;
    border:2px solid #d98a8a;
    border-radius:5px 5px 8px 8px;
    z-index:7;
}

.sword{
    position:absolute;
    width:7px;
    height:42px;
    background:#d9dce0;
    border:1px solid #777;
    z-index:30;
    transform:rotate(42deg);
    display:none;
}

.sword:after{
    content:"";
    position:absolute;
    width:17px;
    height:5px;
    background:#a37a3d;
    left:-6px;
    bottom:1px;
}

#camera{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
}

#message{
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    color:#e5d1aa;
    font-size:27px;
    font-weight:bold;
    text-shadow:0 3px 10px #000;
    z-index:100;
    pointer-events:none;
    white-space:nowrap;
}

#damageFlash{
    position:absolute;
    inset:0;
    background:rgba(255,0,0,.25);
    display:none;
    z-index:90;
}

#bossHud{
    display:none;
    width:900px;
    max-width:96vw;
    margin:auto;
}

#bossName{
    color:#d84a4a;
    font-weight:bold;
}

#bossBar{
    height:15px;
    background:#160708;
    border:2px solid #702020;
}

#bossHealth{
    width:100%;
    height:100%;
    background:#b51f2b;
}

#gameOver{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.92);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:200;
}

#gameOver h2{
    color:#d8c5a0;
    font-size:43px;
}

button{
    border:2px solid #665541;
    border-radius:7px;
    padding:11px 20px;
    margin:4px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:#27231f;
    color:#eee;
}

button:hover{background:#40382f}

.controls{
    margin:8px auto;
}

.controls button{
    width:62px;
    height:45px;
    padding:0;
}

#attack{
    background:#572020;
    border-color:#9a4444;
}

#back{
    color:#ddd;
    text-decoration:none;
    font-weight:bold;
}

#instructions{
    color:#8e8984;
    font-size:13px;
}

@media(max-width:700px){
    #game{
        height:70vh;
    }
}
</style>
</head>

<script>

const game=document.getElementById("game");
const world=document.getElementById("world");
const player=document.getElementById("player");

const healthText=document.getElementById("health");
const levelText=document.getElementById("level");
const scoreText=document.getElementById("score");
const roomName=document.getElementById("roomName");

const message=document.getElementById("message");
const damageFlash=document.getElementById("damageFlash");
const sword=document.getElementById("sword");

const gameOver=document.getElementById("gameOver");
const finalScore=document.getElementById("finalScore");

const bossHud=document.getElementById("bossHud");
const bossName=document.getElementById("bossName");
const bossHealth=document.getElementById("bossHealth");

const exit=document.getElementById("exit");

const WORLD_W=1800;
const WORLD_H=1300;

const PLAYER_W=34;
const PLAYER_H=46;

let px=150;
let py=200;

let health=3;
let score=0;
let level=1;

let enemies=[];
let coins=[];
let potions=[];
let boss=null;

let running=true;
let invincible=false;
let attackCooldown=false;

const walls=[];

/* Room boundaries */

function addWall(x,y,w,h){
    walls.push({x,y,w,h});
}

/* Outer boundary */

addWall(0,0,WORLD_W,20);
addWall(0,WORLD_H-20,WORLD_W,20);
addWall(0,0,20,WORLD_H);
addWall(WORLD_W-20,0,20,WORLD_H);

/* Some interior walls creating room structure */

addWall(80,80,420,12);
addWall(80,368,420,12);

addWall(620,80,420,12);
addWall(620,368,420,12);

addWall(1160,80,500,12);
addWall(1160,368,500,12);

addWall(80,560,420,12);
addWall(80,848,420,12);

addWall(620,560,420,12);
addWall(620,848,420,12);

addWall(1160,560,500,12);
addWall(1160,848,500,12);

function updateHUD(){

    healthText.textContent="❤️ "+health;
    levelText.textContent="Level "+level;
    scoreText.textContent="Score "+score;

}

function overlap(a,b){

    return (
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );

}

function hitsWall(x,y,w=PLAYER_W,h=PLAYER_H){

    const rect={x,y,w,h};

    for(const wall of walls){

        if(overlap(rect,wall)) return true;

    }

    return false;

}

function move(dx,dy){

    if(!running)return;

    const speed=7;

    let nx=px+dx*speed;
    let ny=py+dy*speed;

    nx=Math.max(25,Math.min(WORLD_W-PLAYER_W-25,nx));
    ny=Math.max(25,Math.min(WORLD_H-PLAYER_H-25,ny));

    if(!hitsWall(nx,py))px=nx;
    if(!hitsWall(px,ny))py=ny;

    player.style.left=px+"px";
    player.style.top=py+"px";

    camera();

    collectItems();
    checkExit();
    updateRoom();

}

document.addEventListener("keydown",e=>{

    if(!running)return;

    if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")
        move(0,-1);

    if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")
        move(0,1);

    if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
        move(-1,0);

    if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
        move(1,0);

    if(e.code==="Space"){
        e.preventDefault();
        attack();
    }

});

function camera(){

    let camX=px-450;
    let camY=py-325;

    camX=Math.max(0,Math.min(WORLD_W-900,camX));
    camY=Math.max(0,Math.min(WORLD_H-650,camY));

    world.style.left=(-camX)+"px";
    world.style.top=(-camY)+"px";

}

function updateRoom(){

    let name="Dungeon";

    if(px<500&&py<500)name="Entrance Hall";
    else if(px>600&&px<1050&&py<500)name="Armory";
    else if(px>1150&&py<500)name="Library";
    else if(px<500&&py>550)name="Prison";
    else if(px>600&&px<1050&&py>550&&py<900)name="Crypt";
    else if(px>1150&&py>550)name="Throne Room";
    else if(px>600&&px<1050&&py>1000)name="Treasure Room";

    roomName.textContent=name;

}

function randomPosition(){

    let x,y;

    let attempts=0;

    do{

        x=40+Math.random()*(WORLD_W-100);
        y=40+Math.random()*(WORLD_H-100);

        attempts++;

    }while(
        (hitsWall(x,y,35,45)||Math.hypot(x-px,y-py)<180)
        &&attempts<300
    );

    return{x,y};

}

function createEnemy(type="warrior"){

    const pos=randomPosition();

    const element=document.createElement("div");

    element.className="enemy "+type;

    element.innerHTML=`
        <div class="head"></div>
        <div class="eye"></div>
        <div class="body"></div>
    `;

    element.style.left=pos.x+"px";
    element.style.top=pos.y+"px";

    world.appendChild(element);

    enemies.push({
        element,
        x:pos.x,
        y:pos.y,
        speed:.7+level*.08,
        attackTimer:0
    });

}

function createBoss(){

    const pos=randomPosition();

    const element=document.createElement("div");

    element.className="boss";

    element.innerHTML=`
        <div class="horn left"></div>
        <div class="horn right"></div>
        <div class="head"></div>
        <div class="eye"></div>
        <div class="body"></div>
    `;

    element.style.left=pos.x+"px";
    element.style.top=pos.y+"px";

    world.appendChild(element);

    boss={
        element,
        x:pos.x,
        y:pos.y,
        health:100+level*30,
        maxHealth:100+level*30,
        speed:.45+level*.04,
        attackTimer:0
    };

    bossHud.style.display="block";

    bossName.textContent="👹 DUNGEON BOSS";

    updateBossBar();

    showMessage("⚠️ BOSS LEVEL!");

}

function updateBossBar(){

    if(!boss)return;

    bossHealth.style.width=
        Math.max(0,boss.health/boss.maxHealth*100)+"%";

}

function createCoin(){

    const pos=randomPosition();

    const element=document.createElement("div");

    element.className="coin";

    element.style.left=pos.x+"px";
    element.style.top=pos.y+"px";

    world.appendChild(element);

    coins.push({
        element,
        x:pos.x,
        y:pos.y
    });

}

function createPotion(){

    const pos=randomPosition();

    const element=document.createElement("div");

    element.className="potion";

    element.style.left=pos.x+"px";
    element.style.top=pos.y+"px";

    world.appendChild(element);

    potions.push({
        element,
        x:pos.x,
        y:pos.y
    });

}

function collectItems(){

    coins.slice().forEach(coin=>{

        if(Math.hypot(px-coin.x,py-coin.y)<35){

            coin.element.remove();

            coins.splice(coins.indexOf(coin),1);

            score+=25;

            updateHUD();

        }

    });

    potions.slice().forEach(potion=>{

        if(Math.hypot(px-potion.x,py-potion.y)<35){

            potion.element.remove();

            potions.splice(potions.indexOf(potion),1);

            health=Math.min(5,health+1);

            score+=50;

            showMessage("🧪 HEALTH RESTORED");

            updateHUD();

        }

    });

}

function attack(){

    if(!running||attackCooldown)return;

    attackCooldown=true;

    sword.style.display="block";

    setTimeout(()=>{
        sword.style.display="none";
    },180);

    enemies.slice().forEach(enemy=>{

        if(Math.hypot(px-enemy.x,py-enemy.y)<80){

            enemy.element.remove();

            enemies.splice(enemies.indexOf(enemy),1);

            score+=100;

            showMessage("⚔️ ENEMY DEFEATED");

            updateHUD();

        }

    });

    if(boss&&Math.hypot(px-boss.x,py-boss.y)<110){

        boss.health-=20;

        score+=25;

        updateBossBar();
        updateHUD();

        showMessage("⚔️ BOSS HIT!");

        if(boss.health<=0){

            boss.element.remove();
            boss=null;

            bossHud.style.display="none";

            score+=1000;

            showMessage("🏆 BOSS DEFEATED!");

        }

    }

    setTimeout(()=>{
        attackCooldown=false;
    },350);

}

function damagePlayer(){

    if(invincible)return;

    health--;

    updateHUD();

    invincible=true;

    damageFlash.style.display="block";

    setTimeout(()=>{
        damageFlash.style.display="none";
    },150);

    setTimeout(()=>{
        invincible=false;
    },900);

    if(health<=0)endGame();

}

function enemyAI(){

    enemies.forEach(enemy=>{

        const dx=px-enemy.x;
        const dy=py-enemy.y;

        const distance=Math.hypot(dx,dy);

        if(distance>1){

            const nx=enemy.x+dx/distance*enemy.speed;
            const ny=enemy.y+dy/distance*enemy.speed;

            if(!hitsWall(nx,enemy.y,30,40))
                enemy.x=nx;

            if(!hitsWall(enemy.x,ny,30,40))
                enemy.y=ny;

        }

        enemy.element.style.left=enemy.x+"px";
        enemy.element.style.top=enemy.y+"px";

        if(distance<32){

            enemy.attackTimer--;

            if(enemy.attackTimer<=0){

                damagePlayer();

                enemy.attackTimer=55;

            }

        }

    });

}

function bossAI(){

    if(!boss)return;

    const dx=px-boss.x;
    const dy=py-boss.y;

    const distance=Math.hypot(dx,dy);

    if(distance>1){

        const nx=boss.x+dx/distance*boss.speed;
        const ny=boss.y+dy/distance*boss.speed;

        if(!hitsWall(nx,boss.y,65,80))
            boss.x=nx;

        if(!hitsWall(boss.x,ny,65,80))
            boss.y=ny;

    }

    boss.element.style.left=boss.x+"px";
    boss.element.style.top=boss.y+"px";

    if(distance<80){

        boss.attackTimer--;

        if(boss.attackTimer<=0){

            damagePlayer();

            boss.attackTimer=45;

        }

    }

}

function checkExit(){

    if(
        Math.hypot(
            px-(parseInt(exit.style.left)+25),
            py-(parseInt(exit.style.top)+30)
        )<55
    ){

        if(enemies.length>0||boss){

            showMessage("⚔️ DEFEAT THE ENEMIES FIRST");

        }else{

            nextLevel();

        }

    }

}

function nextLevel(){

    level++;

    score+=250;

    clearEnemies();

    px=150;
    py=200;

    player.style.left=px+"px";
    player.style.top=py+"px";

    const bossLevel=level%5===0;

    if(bossLevel){

        createBoss();

    }else{

        const count=Math.min(15,3+level);

        for(let i=0;i<count;i++){

            const types=["warrior","warrior","archer","knight"];

            createEnemy(
                types[Math.floor(Math.random()*types.length)]
            );

        }

    }

    for(let i=0;i<5;i++)
        createCoin();

    if(level%3===0)
        createPotion();

    showMessage(
        bossLevel
        ?"👹 BOSS LEVEL "+level
        :"LEVEL "+level
    );

    updateHUD();

}

function clearEnemies(){

    enemies.forEach(e=>e.element.remove());

    enemies=[];

    if(boss){

        boss.element.remove();
        boss=null;

    }

    bossHud.style.display="none";

}

function clearItems(){

    coins.forEach(c=>c.element.remove());
    potions.forEach(p=>p.element.remove());

    coins=[];
    potions=[];

}

function restart(){

    clearEnemies();
    clearItems();

    px=150;
    py=200;

    health=3;
    score=0;
    level=1;

    running=true;
    invincible=false;

    gameOver.style.display="none";

    player.style.left=px+"px";
    player.style.top=py+"px";

    for(let i=0;i<4;i++)
        createEnemy();

    for(let i=0;i<5;i++)
        createCoin();

    updateHUD();
    camera();
    updateRoom();

}

function endGame(){

    running=false;

    finalScore.textContent=
        "Score: "+score+
        " | Level: "+level;

    gameOver.style.display="flex";

}

function showMessage(text){

    message.textContent=text;

    setTimeout(()=>{

        if(message.textContent===text)
            message.textContent="";

    },1200);

}

/* START */

for(let i=0;i<4;i++)
    createEnemy();

for(let i=0;i<5;i++)
    createCoin();

player.style.left=px+"px";
player.style.top=py+"px";

updateHUD();
camera();
updateRoom();

function gameLoop(){

    if(running){

        enemyAI();
        bossAI();
        collectItems();
        camera();
        updateRoom();

    }

    requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
