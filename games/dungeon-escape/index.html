<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dungeon Escape 3D - MattBread Arcade</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030304;
    color:#eee;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    flex-direction:column;
    align-items:center;
}

#top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:20;
    pointer-events:none;
    text-align:center;
    padding:8px;
    background:linear-gradient(rgba(0,0,0,.85),transparent);
}

h1{
    margin:0 0 5px;
    color:#d8c5a0;
    font-family:Georgia,serif;
    text-shadow:0 0 12px #000;
}

#hud{
    display:flex;
    justify-content:center;
    gap:30px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#050506;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

#bossHud{
    position:absolute;
    top:75px;
    left:50%;
    transform:translateX(-50%);
    width:min(600px,80vw);
    display:none;
    z-index:25;
    text-align:center;
}

#bossName{
    color:#ff4b4b;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}

#bossBar{
    height:16px;
    border:2px solid #641b1b;
    background:#170707;
}

#bossHealth{
    width:100%;
    height:100%;
    background:#c51f2b;
}

#message{
    position:absolute;
    top:46%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:30;
    font-size:30px;
    font-weight:bold;
    color:#ead7b1;
    text-shadow:0 3px 12px #000;
    pointer-events:none;
    white-space:nowrap;
}

#damage{
    position:absolute;
    inset:0;
    background:rgba(255,0,0,.25);
    display:none;
    z-index:28;
    pointer-events:none;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
    z-index:22;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,.85);
}

#crosshair:before{
    width:18px;
    height:2px;
    top:8px;
}

#crosshair:after{
    width:2px;
    height:18px;
    left:8px;
}

#controls{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:25;
    display:flex;
    gap:8px;
}

button{
    border:2px solid #665541;
    border-radius:7px;
    background:rgba(30,27,25,.9);
    color:#eee;
    font-weight:bold;
    padding:10px 16px;
    cursor:pointer;
}

button:hover{
    background:#4a4034;
}

#attack{
    background:#5b2020;
    border-color:#a14a4a;
}

#gameOver{
    position:absolute;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.93);
    text-align:center;
}

#gameOver h2{
    color:#d8c5a0;
    font-size:48px;
    margin:5px;
}

#gameOver p{
    color:#bbb;
}

#instructions{
    position:absolute;
    bottom:65px;
    left:50%;
    transform:translateX(-50%);
    z-index:25;
    color:#aaa;
    font-size:13px;
    text-shadow:0 2px 4px #000;
    text-align:center;
}

#back{
    position:absolute;
    top:12px;
    right:15px;
    z-index:30;
    color:#ddd;
    text-decoration:none;
    font-weight:bold;
}

#mobile{
    display:none;
    position:absolute;
    bottom:80px;
    left:20px;
    z-index:30;
}

#mobile button{
    width:55px;
    height:48px;
    padding:0;
    margin:2px;
}

@media(max-width:700px){
    #mobile{display:block}
    #controls{display:none}
    #instructions{bottom:15px}
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="top">
<h1>⚔️ DUNGEON ESCAPE 3D</h1>

<div id="hud">
<span id="health">❤️ 3</span>
<span id="room">Entrance</span>
<span id="level">Level 1</span>
<span id="score">Score 0</span>
</div>
</div>

<div id="bossHud">
<div id="bossName">DUNGEON BOSS</div>
<div id="bossBar">
<div id="bossHealth"></div>
</div>
</div>

<div id="crosshair"></div>
<div id="message"></div>
<div id="damage"></div>

<div id="controls">
<button onclick="turn(-1)">↶</button>
<button onclick="move(1)">▲</button>
<button onclick="move(-1)">▼</button>
<button onclick="turn(1)">↷</button>
<button id="attack" onclick="attack()">⚔️ ATTACK</button>
</div>

<div id="mobile">
<button onclick="turn(-1)">↶</button>
<button onclick="move(1)">▲</button>
<button onclick="move(-1)">▼</button>
<button onclick="turn(1)">↷</button>
<button id="attack" onclick="attack()">⚔️</button>
</div>

<div id="instructions">
WASD / Arrow Keys = Move &nbsp; | &nbsp; Mouse = Look &nbsp; | &nbsp; Space = Attack
</div>

<a id="back" href="../../index.html">← Arcade</a>

<div id="gameOver">
<h2>YOU DIED</h2>
<p id="finalScore"></p>
<button onclick="restart()">Restart</button>
</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const healthText=document.getElementById("health");
const scoreText=document.getElementById("score");
const levelText=document.getElementById("level");
const roomText=document.getElementById("room");

const message=document.getElementById("message");
const damage=document.getElementById("damage");

const bossHud=document.getElementById("bossHud");
const bossHealth=document.getElementById("bossHealth");

const gameOver=document.getElementById("gameOver");
const finalScore=document.getElementById("finalScore");

let W=0;
let H=0;

function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
}

window.addEventListener("resize",resize);
resize();

/*
    1 = wall
    0 = floor

    This is a large connected dungeon.
    Rooms are deliberately connected by open corridors.
*/

const map=[
"111111111111111111111111111111111111",
"111111111111111111111111111111111111",
"110000000000011000000000011000000011",
"110000000000011000000000011000000011",
"110000000000011000000000011000000011",
"110000000000000000000000000000000011",
"110000000000011000000000011000000011",
"110000000000011000000000011000000011",
"110000000000011000000000011000000011",
"111111111111011111011111111111111111",
"111111111111011111011111111111111111",
"110000000000000000000000000000000011",
"110000000000000000000000000000000011",
"110000000000000000000000000000000011",
"110000000000000000000000000000000011",
"110000000000000000000000000000000011",
"111111111111011111011111111111111111",
"111111111111011111011111111111111111",
"110000000000011000000000011000000011",
"110000000000011000000000011000000011",
"110000000000011000000000011000000011",
"110000000000000000000000000000000011",
"110000000000011000000000011000000011",
"110000000000011000000000011000000011",
"110000000000011000000000011000000011",
"111111111111011111011111111111111111",
"111111111111011111011111111111111111",
"110000000000011000000000011000000011",
"110000000000011000000000011000000011",
"110000000000011000000000011000000011",
"110000000000000000000000000000000011",
"110000000000011000000000011000000011",
"110000000000011000000000011000000011",
"110000000000011000000000011000000011",
"111111111111111111111111111111111111"
];

const TILE=64;

const MAP_H=map.length;
const MAP_W=map[0].length;

let px=4.5*TILE;
let py=5.5*TILE;

let angle=0;

let health=3;
let score=0;
let level=1;

let running=true;
let invincible=false;
let attacking=false;

let enemies=[];
let items=[];

let boss=null;

const keys={};

document.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.code==="Space"){
        e.preventDefault();
        attack();
    }

});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("click",()=>{
    canvas.requestPointerLock?.();
});

document.addEventListener("mousemove",e=>{

    if(document.pointerLockElement===canvas){
        angle+=e.movementX*.0025;
    }

});

function wallAt(x,y){

    const gx=Math.floor(x/TILE);
    const gy=Math.floor(y/TILE);

    if(
        gx<0||
        gy<0||
        gy>=MAP_H||
        gx>=MAP_W
    )return true;

    return map[gy][gx]==="1";

}

function canMove(x,y){

    const r=14;

    return(
        !wallAt(x-r,y-r)&&
        !wallAt(x+r,y-r)&&
        !wallAt(x-r,y+r)&&
        !wallAt(x+r,y+r)
    );

}

function movePlayer(amount){

    const nx=px+Math.cos(angle)*amount;
    const ny=py+Math.sin(angle)*amount;

    if(canMove(nx,py))px=nx;
    if(canMove(px,ny))py=ny;

}

function strafe(amount){

    const nx=px+Math.cos(angle+Math.PI/2)*amount;
    const ny=py+Math.sin(angle+Math.PI/2)*amount;

    if(canMove(nx,py))px=nx;
    if(canMove(px,ny))py=ny;

}

function turn(amount){

    angle+=amount*.15;

}

function updateMovement(){

    if(!running)return;

    const speed=3;

    if(keys["w"]||keys["arrowup"])
        movePlayer(speed);

    if(keys["s"]||keys["arrowdown"])
        movePlayer(-speed);

    if(keys["a"]||keys["arrowleft"])
        strafe(-speed);

    if(keys["d"]||keys["arrowright"])
        strafe(speed);

}

function raycast(){

    const FOV=Math.PI/3;
    const rays=Math.floor(W/2);

    for(let x=0;x<rays;x++){

        const rayAngle=
            angle-FOV/2+
            FOV*x/rays;

        const dx=Math.cos(rayAngle);
        const dy=Math.sin(rayAngle);

        let distance=0;

        while(distance<1400){

            distance+=2;

            const rx=px+dx*distance;
            const ry=py+dy*distance;

            if(wallAt(rx,ry))break;

        }

        const corrected=
            distance*Math.cos(rayAngle-angle);

        const wallHeight=
            Math.min(
                H*1.5,
                H*TILE/(corrected+1)
            );

        const top=
            H/2-wallHeight/2;

        const shade=
            Math.max(
                20,
                170-corrected*.10
            );

        ctx.fillStyle=
            `rgb(${shade*.75},${shade*.70},${shade*.70})`;

        ctx.fillRect(
            x*2,
            top,
            3,
            wallHeight
        );
    }

}

function drawFloorAndCeiling(){

    ctx.fillStyle="#09090b";
    ctx.fillRect(0,0,W,H/2);

    ctx.fillStyle="#151217";
    ctx.fillRect(0,H/2,W,H/2);

}

function distanceTo(x,y){

    return Math.hypot(
        x-px,
        y-py
    );

}

function projectObject(obj){

    const dx=obj.x-px;
    const dy=obj.y-py;

    const distance=Math.hypot(dx,dy);

    let relative=
        Math.atan2(dy,dx)-angle;

    while(relative>Math.PI)
        relative-=Math.PI*2;

    while(relative<-Math.PI)
        relative+=Math.PI*2;

    const FOV=Math.PI/3;

    if(Math.abs(relative)>FOV/2)
        return null;

    const screenX=
        W/2+
        relative/(FOV/2)*
        W/2;

    const size=
        Math.min(
            H*1.2,
            H*TILE/(distance+1)
        );

    const screenY=
        H/2-size/2;

    return{
        x:screenX,
        y:screenY,
        size,
        distance
    };

}

function drawEnemies(){

    const objects=[...enemies];

    if(boss)objects.push(boss);

    objects.sort(
        (a,b)=>
            distanceTo(b.x,b.y)-
            distanceTo(a.x,a.y)
    );

    objects.forEach(enemy=>{

        const p=projectObject(enemy);

        if(!p)return;

        const s=p.size;

        if(enemy.isBoss){

            ctx.fillStyle="#301014";

            ctx.fillRect(
                p.x-s*.25,
                p.y+s*.30,
                s*.5,
                s*.45
            );

            ctx.fillStyle="#593535";

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y+s*.2,
                s*.27,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#ff2525";

            ctx.beginPath();

            ctx.arc(
                p.x-s*.09,
                p.y+s*.16,
                s*.045,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.beginPath();

            ctx.arc(
                p.x+s*.09,
                p.y+s*.16,
                s*.045,
                0,
                Math.PI*2
            );

            ctx.fill();

        }else{

            ctx.fillStyle=
                enemy.type==="archer"
                ?"#31513a"
                :"#572d2d";

            ctx.fillRect(
                p.x-s*.18,
                p.y+s*.30,
                s*.36,
                s*.35
            );

            ctx.fillStyle="#8b6c58";

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y+s*.18,
                s*.17,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#ff3030";

            ctx.fillRect(
                p.x-s*.08,
                p.y+s*.15,
                s*.045,
                s*.045
            );

            ctx.fillRect(
                p.x+s*.035,
                p.y+s*.15,
                s*.045,
                s*.045
            );

        }

    });

}

function drawItems(){

    items.forEach(item=>{

        const p=projectObject(item);

        if(!p)return;

        ctx.fillStyle=
            item.type==="potion"
            ?"#b52b36"
            :"#d2a632";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y+p.size*.35,
            Math.max(4,p.size*.09),
            0,
            Math.PI*2
        );

        ctx.fill();

    });

}

function spawnEnemy(){

    for(let i=0;i<300;i++){

        const x=
            (Math.floor(
                Math.random()*(MAP_W-2)
            )+.5)*TILE;

        const y=
            (Math.floor(
                Math.random()*(MAP_H-2)
            )+.5)*TILE;

        if(
            !wallAt(x,y)&&
            distanceTo(x,y)>350
        ){

            enemies.push({
                x,
                y,
                type:
                    Math.random()<.25
                    ?"archer"
                    :"warrior",
                speed:.45+level*.04,
                attackTimer:0
            });

            return;

        }

    }

}

function spawnItem(type){

    for(let i=0;i<300;i++){

        const x=
            (Math.floor(
                Math.random()*(MAP_W-2)
            )+.5)*TILE;

        const y=
            (Math.floor(
                Math.random()*(MAP_H-2)
            )+.5)*TILE;

        if(
            !wallAt(x,y)&&
            distanceTo(x,y)>250
        ){

            items.push({
                x,
                y,
                type
            });

            return;

        }

    }

}

function spawnBoss(){

    for(let i=0;i<300;i++){

        const x=
            (Math.floor(
                Math.random()*(MAP_W-2)
            )+.5)*TILE;

        const y=
            (Math.floor(
                Math.random()*(MAP_H-2)
            )+.5)*TILE;

        if(
            !wallAt(x,y)&&
            distanceTo(x,y)>500
        ){

            boss={
                x,
                y,
                isBoss:true,
                health:150+level*30,
                maxHealth:150+level*30,
                speed:.35+level*.02,
                attackTimer:0
            };

            bossHud.style.display="block";

            showMessage("👹 BOSS LEVEL!");

            return;

        }

    }

}

function enemyAI(){

    enemies.forEach(enemy=>{

        const dx=px-enemy.x;
        const dy=py-enemy.y;

        const d=Math.hypot(dx,dy);

        if(d<500&&d>1){

            const nx=
                enemy.x+
                dx/d*
                enemy.speed;

            const ny=
                enemy.y+
                dy/d*
                enemy.speed;

            if(canMove(nx,enemy.y))
                enemy.x=nx;

            if(canMove(enemy.x,ny))
                enemy.y=ny;

        }

        if(d<35){

            enemy.attackTimer--;

            if(enemy.attackTimer<=0){

                hurt();

                enemy.attackTimer=60;

            }

        }

    });

}

function bossAI(){

    if(!boss)return;

    const dx=px-boss.x;
    const dy=py-boss.y;

    const d=Math.hypot(dx,dy);

    if(d<700&&d>1){

        const nx=
            boss.x+
            dx/d*
            boss.speed;

        const ny=
            boss.y+
            dy/d*
            boss.speed;

        if(canMove(nx,boss.y))
            boss.x=nx;

        if(canMove(boss.x,ny))
            boss.y=ny;

    }

    if(d<70){

        boss.attackTimer--;

        if(boss.attackTimer<=0){

            hurt();

            boss.attackTimer=45;

        }

    }

}

function attack(){

    if(!running||attacking)return;

    attacking=true;

    showMessage("⚔️");

    let target=null;
    let best=95;

    enemies.forEach(enemy=>{

        const d=distanceTo(enemy.x,enemy.y);

        if(d<best){

            best=d;
            target=enemy;

        }

    });

    if(target){

        enemies.splice(
            enemies.indexOf(target),
            1
        );

        score+=100;

        showMessage("⚔️ ENEMY DEFEATED");

    }

    if(boss){

        const d=distanceTo(boss.x,boss.y);

        if(d<120){

            boss.health-=20;

            updateBossBar();

            score+=25;

            if(boss.health<=0){

                boss=null;

                bossHud.style.display="none";

                score+=1000;

                showMessage("🏆 BOSS DEFEATED!");

            }

        }

    }

    setTimeout(()=>{
        attacking=false;
    },300);

}

function hurt(){

    if(invincible)return;

    health--;

    updateHUD();

    invincible=true;

    damage.style.display="block";

    setTimeout(()=>{
        damage.style.display="none";
    },150);

    setTimeout(()=>{
        invincible=false;
    },900);

    if(health<=0)
        endGame();

}

function collectItems(){

    items.slice().forEach(item=>{

        if(distanceTo(item.x,item.y)<35){

            items.splice(
                items.indexOf(item),
                1
            );

            if(item.type==="potion"){

                health=Math.min(5,health+1);

                score+=50;

                showMessage("🧪 HEALTH RESTORED");

            }else{

                score+=25;

            }

            updateHUD();

        }

    });

}

function updateBossBar(){

    if(!boss)return;

    bossHealth.style.width=
        Math.max(
            0,
            boss.health/boss.maxHealth*100
        )+"%";

}

function updateRoom(){

    const gx=Math.floor(px/TILE);
    const gy=Math.floor(py/TILE);

    let name="Dungeon";

    if(gy<10&&gx<13)
        name="Entrance Hall";
    else if(gy<10&&gx<24)
        name="Armory";
    else if(gy<10)
        name="Library";
    else if(gy>17&&gx<13)
        name="Prison";
    else if(gy>17&&gx<24)
        name="Crypt";
    else if(gy>17)
        name="Throne Room";
    else if(gy>27)
        name="Treasure Room";

    roomText.textContent=name;

}

function updateHUD(){

    healthText.textContent="❤️ "+health;
    scoreText.textContent="Score "+score;
    levelText.textContent="Level "+level;

}

function nextLevel(){

    level++;

    score+=250;

    enemies=[];
    items=[];

    if(level%5===0)
        spawnBoss();
    else{

        for(let i=0;i<4+level;i++)
            spawnEnemy();

    }

    for(let i=0;i<5;i++)
        spawnItem("coin");

    if(level%3===0)
        spawnItem("potion");

    showMessage("LEVEL "+level);

    updateHUD();

}

function restart(){

    px=4.5*TILE;
    py=5.5*TILE;

    angle=0;

    health=3;
    score=0;
    level=1;

    enemies=[];
    items=[];
    boss=null;

    bossHud.style.display="none";

    running=true;

    gameOver.style.display="none";

    for(let i=0;i<4;i++)
        spawnEnemy();

    for(let i=0;i<5;i++)
        spawnItem("coin");

    updateHUD();

}

function endGame(){

    running=false;

    finalScore.textContent=
        "Score: "+score+
        " | Level: "+level;

    gameOver.style.display="flex";

}

function showMessage(text){

    message.textContent=text;

    setTimeout(()=>{

        if(message.textContent===text)
            message.textContent="";

    },1100);

}

function draw(){

    drawFloorAndCeiling();
    raycast();
    drawItems();
    drawEnemies();

}

function loop(){

    updateMovement();
    enemyAI();
    bossAI();
    collectItems();
    updateRoom();

    draw();

    requestAnimationFrame(loop);

}

restart();

loop();

</script>

</body>
</html>
