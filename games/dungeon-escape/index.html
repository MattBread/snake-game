<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeon Escape | MattBread Arcade</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d16;color:#f2f5ff;font-family:Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#hud{position:fixed;top:14px;left:14px;z-index:2;background:#101827e8;border:1px solid #34445f;border-radius:12px;padding:12px 16px;min-width:210px}
#hud strong{color:#7cf7ff}
#health{height:10px;background:#3b1c2b;border-radius:8px;margin-top:8px;overflow:hidden}
#healthFill{height:100%;width:100%;background:#ff496c;transition:width .15s}
#help{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#101827e8;border:1px solid #34445f;border-radius:10px;padding:10px 14px;text-align:center;font-size:13px;width:max-content;max-width:95vw}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050812c9;z-index:5;padding:20px}
.panel{max-width:510px;width:100%;padding:30px;background:linear-gradient(145deg,#17243a,#0c1220);border:1px solid #425b80;border-radius:18px;text-align:center;box-shadow:0 0 50px #00d9ff22}
h1{font-size:clamp(30px,6vw,48px);margin:0 0 10px;color:#7cf7ff;text-shadow:0 0 18px #00d9ff66}
p{line-height:1.6;color:#c8d3e8}
button{cursor:pointer;background:linear-gradient(90deg,#00bcd4,#7164ff);color:white;border:0;border-radius:9px;padding:13px 22px;font-size:16px;font-weight:bold;margin:6px}
button:hover{filter:brightness(1.15)}
.small{font-size:12px;color:#8e9cb4}
</style>
</head>
<body>
<div id="hud">
  <strong>DUNGEON ESCAPE</strong>
  <div id="stats">Health: 100 · Enemies: 5</div>
  <div id="health"><div id="healthFill"></div></div>
  <div style="margin-top:8px;font-size:13px" id="objective">Find the golden exit.</div>
</div>
<div id="help">Move: WASD / Arrow Keys &nbsp; · &nbsp; Attack: Space / Click &nbsp; · &nbsp; Restart: R</div>
<div id="overlay">
  <div class="panel">
    <h1 id="title">DUNGEON ESCAPE</h1>
    <p id="message">Fight through the dungeon, defeat every monster, and reach the glowing golden exit.</p>
    <button id="start">ENTER THE DUNGEON</button>
    <p class="small">A MattBread Arcade adventure</p>
    <a href="../../../" style="color:#7cf7ff;font-size:13px">← Back to MattBread Arcade</a>
  </div>
</div>

<script>
(() => {
"use strict";

const canvas = document.createElement("canvas");
document.body.insertBefore(canvas, document.body.firstChild);
const ctx = canvas.getContext("2d");

const hudStats = document.getElementById("stats");
const healthFill = document.getElementById("healthFill");
const objective = document.getElementById("objective");
const overlay = document.getElementById("overlay");
const title = document.getElementById("title");
const message = document.getElementById("message");
const startButton = document.getElementById("start");

const TILE = 48;
const MAP = [
"####################",
"#P.....#..........E#",
"#......#..##.......#",
"#..##.....##..##...#",
"#..##............###",
"#......####.........#",
"###...........##....#",
"#......##...........#",
"#..##......###......#",
"#..##...............#",
"#......###....##....#",
"#.............##....#",
"#..##...............#",
"#..##...##......##..#",
"#........##.........#",
"#.............##....#",
"#..##...............#",
"#.............##....#",
"#...................#",
"####################"
];

const mapHeight = MAP.length;
const mapWidth = Math.max(...MAP.map(row => row.length));
const worldWidth = mapWidth * TILE;
const worldHeight = mapHeight * TILE;

let walls = [];
let enemies = [];
let particles = [];
let player;
let started = false;
let ended = false;
let lastTime = 0;
let attackCooldown = 0;
let hurtFlash = 0;
const keys = Object.create(null);

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function resetGame() {
  walls = [];
  enemies = [];
  particles = [];
  player = {
    x: TILE * 1.5, y: TILE * 1.5,
    r: 13, speed: 185, health: 100,
    facingX: 1, facingY: 0,
    attack: 0, invulnerable: 0
  };
  attackCooldown = 0;
  hurtFlash = 0;
  ended = false;

  for (let y = 0; y < mapHeight; y++) {
    for (let x = 0; x < mapWidth; x++) {
      const cell = (MAP[y] || "")[x] || "#";
      if (cell === "#") walls.push({x, y});
      if (cell === "E") {
        enemies.push({
          x: x * TILE + TILE / 2,
          y: y * TILE + TILE / 2,
          r: 14, health: 55, speed: 57,
          attackCooldown: Math.random(),
          alive: true, wander: Math.random() * 6
        });
      }
    }
  }
}

function isWallAt(x, y) {
  const tx = Math.floor(x / TILE);
  const ty = Math.floor(y / TILE);
  if (ty < 0 || ty >= mapHeight || tx < 0 || tx >= mapWidth) return true;
  return ((MAP[ty] || "")[tx] || "#") === "#";
}

// Circle-versus-tile collision. Walls and movement use the same map.
function blocked(x, y, radius) {
  const minX = Math.floor((x - radius) / TILE);
  const maxX = Math.floor((x + radius) / TILE);
  const minY = Math.floor((y - radius) / TILE);
  const maxY = Math.floor((y + radius) / TILE);

  for (let ty = minY; ty <= maxY; ty++) {
    for (let tx = minX; tx <= maxX; tx++) {
      if (ty < 0 || ty >= mapHeight || tx < 0 || tx >= mapWidth ||
          ((MAP[ty] || "")[tx] || "#") === "#") {
        const left = tx * TILE, top = ty * TILE;
        const cx = Math.max(left, Math.min(x, left + TILE));
        const cy = Math.max(top, Math.min(y, top + TILE));
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy < radius * radius) return true;
      }
    }
  }
  return false;
}

function moveEntity(entity, dx, dy) {
  if (!blocked(entity.x + dx, entity.y, entity.r)) entity.x += dx;
  if (!blocked(entity.x, entity.y + dy, entity.r)) entity.y += dy;
}

function spawnParticles(x, y, color, amount = 8) {
  for (let i = 0; i < amount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 35 + Math.random() * 130;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: .25 + Math.random() * .45,
      maxLife: .7,
      color
    });
  }
}

function attack() {
  if (!started || ended || attackCooldown > 0) return;
  attackCooldown = .38;
  player.attack = .19;

  const reach = 57;
  let hitSomething = false;
  for (const enemy of enemies) {
    if (!enemy.alive) continue;
    const dx = enemy.x - player.x;
    const dy = enemy.y - player.y;
    const distance = Math.hypot(dx, dy);
    if (distance > reach + enemy.r) continue;
    if (distance > 0 &&
        (dx / distance) * player.facingX +
        (dy / distance) * player.facingY < .15) continue;

    enemy.health -= 30;
    spawnParticles(enemy.x, enemy.y, "#ffbf69", 10);
    hitSomething = true;
    if (enemy.health <= 0) {
      enemy.alive = false;
      spawnParticles(enemy.x, enemy.y, "#ff496c", 18);
    }
  }
  if (!hitSomething) spawnParticles(
    player.x + player.facingX * 36,
    player.y + player.facingY * 36,
    "#7cf7ff", 4
  );
}

function aliveEnemies() {
  return enemies.filter(e => e.alive).length;
}

function showEnd(won) {
  ended = true;
  started = false;
  overlay.style.display = "flex";
  title.textContent = won ? "DUNGEON CLEARED!" : "YOU WERE DEFEATED";
  message.textContent = won
    ? "Every monster has fallen. You escaped the dungeon!"
    : "The dungeon was too dangerous this time. Give it another try.";
  startButton.textContent = "PLAY AGAIN";
}

function update(dt) {
  if (!started || ended) return;
  dt = Math.min(dt, .035);

  attackCooldown = Math.max(0, attackCooldown - dt);
  player.attack = Math.max(0, player.attack - dt);
  player.invulnerable = Math.max(0, player.invulnerable - dt);
  hurtFlash = Math.max(0, hurtFlash - dt);

  let dx = 0, dy = 0;
  if (keys.KeyW || keys.ArrowUp) dy -= 1;
  if (keys.KeyS || keys.ArrowDown) dy += 1;
  if (keys.KeyA || keys.ArrowLeft) dx -= 1;
  if (keys.KeyD || keys.ArrowRight) dx += 1;

  if (dx || dy) {
    const length = Math.hypot(dx, dy);
    dx /= length; dy /= length;
    player.facingX = dx;
    player.facingY = dy;
    moveEntity(player, dx * player.speed * dt, dy * player.speed * dt);
  }

  for (const enemy of enemies) {
    if (!enemy.alive) continue;
    enemy.attackCooldown -= dt;
    enemy.wander += dt;

    const vx = player.x - enemy.x;
    const vy = player.y - enemy.y;
    const distance = Math.hypot(vx, vy);

    if (distance < TILE * 5 && distance > player.r + enemy.r + 2) {
      moveEntity(enemy, vx / distance * enemy.speed * dt,
                        vy / distance * enemy.speed * dt);
    } else if (distance > player.r + enemy.r + 2) {
      const wx = Math.cos(enemy.wander) * .35;
      const wy = Math.sin(enemy.wander) * .35;
      moveEntity(enemy, wx * enemy.speed * dt, wy * enemy.speed * dt);
    }

    const nowDistance = Math.hypot(player.x - enemy.x, player.y - enemy.y);
    if (nowDistance < player.r + enemy.r + 5 &&
        enemy.attackCooldown <= 0 && player.invulnerable <= 0) {
      player.health -= 10;
      player.invulnerable = .7;
      enemy.attackCooldown = .85;
      hurtFlash = .18;
      spawnParticles(player.x, player.y, "#ff496c", 8);
      if (player.health <= 0) {
        player.health = 0;
        showEnd(false);
      }
    }
  }

  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  const remaining = aliveEnemies();
  hudStats.textContent = `Health: ${player.health} · Enemies: ${remaining}`;
  healthFill.style.width = player.health + "%";
  objective.textContent = remaining
    ? `Defeat the remaining ${remaining} monster${remaining === 1 ? "" : "s"}.`
    : "The exit is open! Find the golden door.";

  // Exit tile is only usable after all enemies are defeated.
  if (remaining === 0) {
    const exitX = (mapWidth - 2) * TILE + TILE / 2;
    const exitY = TILE * 1.5;
    if (Math.hypot(player.x - exitX, player.y - exitY) < TILE * .6) {
      showEnd(true);
    }
  }
}

function draw() {
  const w = innerWidth, h = innerHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#070b13";
  ctx.fillRect(0, 0, w, h);
  if (!player) return;

  // Camera follows the player.
  const cameraX = Math.max(0, Math.min(worldWidth - w, player.x - w / 2));
  const cameraY = Math.max(0, Math.min(worldHeight - h, player.y - h / 2));
  ctx.save();
  ctx.translate(-cameraX, -cameraY);

  // Solid stone floor: no floating planks or gaps.
  for (let y = 0; y < mapHeight; y++) {
    for (let x = 0; x < mapWidth; x++) {
      const px = x * TILE, py = y * TILE;
      ctx.fillStyle = (x + y) % 2 ? "#343e4b" : "#3b4654";
      ctx.fillRect(px, py, TILE, TILE);
      ctx.strokeStyle = "#29323e";
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 1, py + 1, TILE - 2, TILE - 2);
      // Subtle stone wear.
      ctx.fillStyle = "#ffffff09";
      ctx.fillRect(px + 5, py + 5, 9, 2);
    }
  }

  // Walls are drawn from the exact same map used for collision.
  for (const wall of walls) {
    const x = wall.x * TILE, y = wall.y * TILE;
    ctx.fillStyle = "#172131";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = "#394b61";
    ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 7);
    ctx.fillStyle = "#53657a";
    ctx.fillRect(x + 4, y + 4, TILE - 8, 5);
    ctx.fillStyle = "#101724";
    ctx.fillRect(x + 3, y + TILE - 7, TILE - 6, 5);
    ctx.strokeStyle = "#101722";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
  }

  // Exit: the gate glows brighter once every enemy is defeated.
  const exitX = (mapWidth - 2) * TILE + TILE / 2;
  const exitY = TILE * 1.5;
  const exitOpen = aliveEnemies() === 0;
  const glow = ctx.createRadialGradient(exitX, exitY, 3, exitX, exitY, 72);
  glow.addColorStop(0, exitOpen ? "#ffe87c66" : "#e9a73520");
  glow.addColorStop(1, "#e9a73500");
  ctx.fillStyle = glow;
  ctx.fillRect(exitX - 75, exitY - 75, 150, 150);
  ctx.fillStyle = exitOpen ? "#ffe06b" : "#96733b";
  ctx.fillRect(exitX - 15, exitY - 22, 30, 44);
  ctx.fillStyle = "#191d27";
  ctx.fillRect(exitX - 9, exitY - 16, 18, 36);
  ctx.fillStyle = "#ffe87b";
  ctx.beginPath();
  ctx.arc(exitX + 5, exitY + 1, 3, 0, Math.PI * 2);
  ctx.fill();

  // Enemies.
  for (const enemy of enemies) {
    if (!enemy.alive) continue;
    ctx.fillStyle = "#00000055";
    ctx.beginPath();
    ctx.ellipse(enemy.x, enemy.y + 8, 17, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#8e2c54";
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, enemy.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#d64a70";
    ctx.beginPath();
    ctx.arc(enemy.x - 3, enemy.y - 4, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff0d7";
    ctx.fillRect(enemy.x - 7, enemy.y - 5, 4, 4);
    ctx.fillRect(enemy.x + 3, enemy.y - 5, 4, 4);
    ctx.fillStyle = "#ff496c";
    ctx.fillRect(enemy.x - 15, enemy.y - 24, 30, 4);
    ctx.fillStyle = "#80ff9f";
    ctx.fillRect(enemy.x - 15, enemy.y - 24,
      30 * Math.max(0, enemy.health) / 55, 4);
  }

  // Player and sword.
  if (player.invulnerable <= 0 || Math.floor(performance.now() / 80) % 2 === 0) {
    ctx.fillStyle = "#00000066";
    ctx.beginPath();
    ctx.ellipse(player.x, player.y + 8, 17, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#2463a6";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#53b7ff";
    ctx.beginPath();
    ctx.arc(player.x - 3, player.y - 5, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#f0d4a6";
    ctx.beginPath();
    ctx.arc(player.x, player.y - 3, 6, 0, Math.PI * 2);
    ctx.fill();

    const swordLength = player.attack > 0 ? 39 : 25;
    const sx = player.x + player.facingX * swordLength;
    const sy = player.y + player.facingY * swordLength;
    ctx.strokeStyle = "#d7f8ff";
    ctx.lineWidth = player.attack > 0 ? 7 : 4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(player.x + player.facingX * 8, player.y + player.facingY * 8);
    ctx.lineTo(sx, sy);
    ctx.stroke();
    ctx.strokeStyle = "#f4bf65";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(sx - player.facingY * 5, sy + player.facingX * 5);
    ctx.lineTo(sx + player.facingY * 5, sy - player.facingX * 5);
    ctx.stroke();
  }

  // Combat particles.
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Atmospheric darkness around the player with a large clear sight radius.
  const light = ctx.createRadialGradient(player.x, player.y, 55, player.x, player.y, 310);
  light.addColorStop(0, "#00000000");
  light.addColorStop(.7, "#02061118");
  light.addColorStop(1, "#020611b8");
  ctx.fillStyle = light;
  ctx.fillRect(cameraX, cameraY, w, h);

  ctx.restore();

  if (hurtFlash > 0) {
    ctx.fillStyle = `rgba(255,35,80,${hurtFlash * .6})`;
    ctx.fillRect(0, 0, w, h);
  }
}

function frame(time) {
  const dt = lastTime ? (time - lastTime) / 1000 : 0;
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

function startGame() {
  if (started) return;
  resetGame();
  started = true;
  ended = false;
  overlay.style.display = "none";
  lastTime = 0;
}

startButton.addEventListener("click", startGame);

document.addEventListener("keydown", event => {
  keys[event.code] = true;
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) {
    event.preventDefault();
  }
  if (event.code === "Enter" && !started) startGame();
  if (event.code === "Space") attack();
  if (event.code === "KeyR") {
    resetGame();
    started = true;
    ended = false;
    overlay.style.display = "none";
  }
});

document.addEventListener("keyup", event => {
  keys[event.code] = false;
});
window.addEventListener("blur", () => {
  for (const key in keys) keys[key] = false;
});
canvas.addEventListener("pointerdown", event => {
  if (event.button === 0) attack();
});

resetGame();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
