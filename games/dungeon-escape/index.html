<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dungeon Escape - Dark Realm</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050608;
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#topbar{
    position:absolute;
    top:20px;
    left:20px;
    display:flex;
    gap:15px;
    align-items:center;
}

.panel{
    background:rgba(5,7,12,.78);
    border:1px solid rgba(255,255,255,.16);
    border-radius:12px;
    padding:10px 14px;
    backdrop-filter:blur(8px);
    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

#healthBox{
    width:220px;
}

#healthLabel{
    font-size:12px;
    margin-bottom:6px;
    color:#ddd;
    letter-spacing:1px;
}

#healthOuter{
    width:100%;
    height:14px;
    background:#210708;
    border-radius:8px;
    overflow:hidden;
}

#health{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#7b0808,#ff3b26);
    transition:width .2s;
}

#stats{
    font-size:13px;
    line-height:1.7;
}

#boss{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:360px;
    display:none;
    text-align:center;
}

#bossName{
    font-size:14px;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:7px;
}

#bossOuter{
    height:14px;
    background:#17030a;
    border:1px solid rgba(255,255,255,.2);
    border-radius:8px;
    overflow:hidden;
}

#bossHealth{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#7d0028,#ff164f);
}

#message{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 20px;
    border-radius:10px;
    background:rgba(0,0,0,.65);
    border:1px solid rgba(255,255,255,.12);
    font-size:14px;
    opacity:0;
    transition:opacity .3s;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
    opacity:.7;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 5px #fff;
}

#crosshair:before{
    width:2px;
    height:18px;
    left:8px;
    top:0;
}

#crosshair:after{
    width:18px;
    height:2px;
    left:0;
    top:8px;
}

#help{
    position:absolute;
    right:20px;
    bottom:20px;
    font-size:12px;
    color:#bbb;
    text-align:right;
    line-height:1.8;
}

#start{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
      radial-gradient(circle at center,rgba(70,35,20,.25),rgba(0,0,0,.94)),
      #050608;
    color:white;
}

.startBox{
    width:min(560px,90%);
    padding:42px;
    text-align:center;
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    background:rgba(10,12,17,.9);
    box-shadow:0 30px 80px rgba(0,0,0,.75);
}

.startBox h1{
    font-size:42px;
    letter-spacing:5px;
    margin-bottom:10px;
    text-shadow:0 0 25px rgba(255,80,30,.4);
}

.startBox p{
    color:#aaa;
    margin:10px 0;
}

#startButton{
    margin-top:25px;
    border:0;
    border-radius:10px;
    padding:15px 35px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#8e1710,#e0471d);
    box-shadow:0 10px 30px rgba(180,40,10,.3);
}

#startButton:hover{
    transform:translateY(-2px);
}

#damage{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:rgba(180,0,0,.35);
    opacity:0;
    z-index:10;
}

#gameOver{
    position:fixed;
    inset:0;
    display:none;
    z-index:30;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.82);
    color:white;
    text-align:center;
}

.gameOverBox{
    padding:40px;
    border-radius:18px;
    background:#0c0d11;
    border:1px solid rgba(255,255,255,.15);
}

.gameOverBox h2{
    font-size:38px;
    margin-bottom:12px;
}

#restart{
    margin-top:20px;
    padding:13px 28px;
    border:0;
    border-radius:9px;
    background:#b42b18;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:700px){
    #topbar{
        top:10px;
        left:10px;
    }

    #healthBox{
        width:160px;
    }

    #stats{
        display:none;
    }

    #help{
        right:10px;
        bottom:10px;
    }

    #boss{
        width:230px;
    }

    .startBox h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

    <div id="topbar">

        <div class="panel" id="healthBox">
            <div id="healthLabel">VITALITY</div>
            <div id="healthOuter">
                <div id="health"></div>
            </div>
        </div>

        <div class="panel" id="stats">
            <div>LEVEL: <span id="level">1</span></div>
            <div>SOULS: <span id="souls">0</span></div>
        </div>

    </div>

    <div id="boss">
        <div id="bossName">DUNGEON BOSS</div>
        <div id="bossOuter">
            <div id="bossHealth"></div>
        </div>
    </div>

    <div id="crosshair"></div>

    <div id="message"></div>

    <div id="help">
        WASD / ARROWS — Move<br>
        MOUSE — Look around<br>
        SPACE — Attack
    </div>

</div>

<div id="damage"></div>

<div id="start">
    <div class="startBox">
        <h1>DUNGEON ESCAPE</h1>
        <p>A forgotten fortress lies beneath the earth.</p>
        <p>Fight your way through the darkness.</p>
        <button id="startButton">ENTER THE DUNGEON</button>
    </div>
</div>

<div id="gameOver">
    <div class="gameOverBox">
        <h2>YOU DIED</h2>
        <p>The dungeon has claimed another warrior.</p>
        <button id="restart">RETURN TO DUNGEON</button>
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { PointerLockControls } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/PointerLockControls.js";

/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050608);

scene.fog = new THREE.FogExp2(
    0x090a0d,
    0.035
);

/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    62,
    innerWidth / innerHeight,
    0.1,
    500
);

camera.position.set(0,4,7);

/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.getElementById("game").appendChild(renderer.domElement);

/* =========================================================
   LIGHTING
========================================================= */

const ambient = new THREE.HemisphereLight(
    0x6b7180,
    0x120b08,
    0.55
);

scene.add(ambient);

const moon = new THREE.DirectionalLight(
    0x8fa8ff,
    0.8
);

moon.position.set(-20,35,10);
moon.castShadow = true;

moon.shadow.mapSize.set(2048,2048);

scene.add(moon);

/* =========================================================
   MATERIALS
========================================================= */

const floorMat = new THREE.MeshStandardMaterial({
    color:0x292725,
    roughness:.95,
    metalness:.02
});

const wallMat = new THREE.MeshStandardMaterial({
    color:0x363331,
    roughness:.88,
    metalness:.05
});

const darkWallMat = new THREE.MeshStandardMaterial({
    color:0x1d1b1b,
    roughness:.95
});

const woodMat = new THREE.MeshStandardMaterial({
    color:0x332019,
    roughness:.85
});

const metalMat = new THREE.MeshStandardMaterial({
    color:0x45484d,
    roughness:.4,
    metalness:.7
});

/* =========================================================
   DUNGEON
========================================================= */

const dungeon = new THREE.Group();
scene.add(dungeon);

/* floor */

const floor = new THREE.Mesh(
    new THREE.BoxGeometry(80,.5,80),
    floorMat
);

floor.position.y=-.25;
floor.receiveShadow=true;

dungeon.add(floor);

/* ceiling */

const ceiling = new THREE.Mesh(
    new THREE.BoxGeometry(80,.5,80),
    darkWallMat
);

ceiling.position.y=12;
ceiling.receiveShadow=true;

dungeon.add(ceiling);

/* =========================================================
   WALL CREATOR
========================================================= */

function wall(x,z,w,d,h=12){

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        wallMat
    );

    mesh.position.set(x,h/2,z);

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    dungeon.add(mesh);

    return mesh;
}

/* =========================================================
   MAIN OUTER WALLS
========================================================= */

wall(0,-40,80,2);
wall(0,40,80,2);
wall(-40,0,2,80);
wall(40,0,2,80);

/* =========================================================
   LARGE CENTRAL HALL
========================================================= */

wall(-15,-20,2,30);
wall(15,-20,2,30);

wall(-15,20,2,30);
wall(15,20,2,30);

/* =========================================================
   SIDE ROOMS
========================================================= */

wall(-30,-5,20,2);
wall(-30,15,20,2);

wall(30,-5,20,2);
wall(30,15,20,2);

wall(-30,28,20,2);
wall(30,28,20,2);

/* =========================================================
   INNER ROOMS
========================================================= */

wall(-10,5,10,2);
wall(10,5,10,2);

wall(-10,-8,10,2);
wall(10,-8,10,2);

wall(-25,-25,18,2);
wall(25,-25,18,2);

/* =========================================================
   PILLARS
========================================================= */

function pillar(x,z){

    const group=new THREE.Group();

    const base=new THREE.Mesh(
        new THREE.BoxGeometry(2.5,.8,2.5),
        stoneMaterial()
    );

    base.position.y=.4;

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(1.6,9,1.6),
        wallMat
    );

    body.position.y=5;

    const top=new THREE.Mesh(
        new THREE.BoxGeometry(2.5,.8,2.5),
        stoneMaterial()
    );

    top.position.y=9.6;

    group.add(base,body,top);

    group.position.set(x,0,z);

    group.traverse(o=>{
        if(o.isMesh){
            o.castShadow=true;
            o.receiveShadow=true;
        }
    });

    dungeon.add(group);
}

function stoneMaterial(){

    return new THREE.MeshStandardMaterial({
        color:0x46423e,
        roughness:.9
    });

}

[
[-12,-28],
[12,-28],
[-12,28],
[12,28],
[-25,0],
[25,0],
[-5,15],
[5,15],
[-5,-15],
[5,-15]
].forEach(p=>pillar(p[0],p[1]));

/* =========================================================
   TORCHES
========================================================= */

const torchLights=[];

function torch(x,z){

    const group=new THREE.Group();

    const handle=new THREE.Mesh(
        new THREE.CylinderGeometry(.12,.15,2,8),
        woodMat
    );

    handle.position.y=3;

    group.add(handle);

    const fire=new THREE.Mesh(
        new THREE.SphereGeometry(.35,10,10),
        new THREE.MeshBasicMaterial({
            color:0xff5418
        })
    );

    fire.scale.set(.7,1.3,.7);
    fire.position.y=4.2;

    group.add(fire);

    const light=new THREE.PointLight(
        0xff5a20,
        3,
        12,
        2
    );

    light.position.y=4.2;

    light.castShadow=true;

    group.add(light);

    group.position.set(x,0,z);

    scene.add(group);

    torchLights.push({
        light,
        fire
    });
}

/* place lots of torches */

[
[-14,-34],
[14,-34],
[-14,34],
[14,34],
[-33,-3],
[-33,20],
[33,-3],
[33,20],
[-8,0],
[8,0],
[-8,23],
[8,23],
[-8,-23],
[8,-23]
].forEach(p=>torch(p[0],p[1]));

/* =========================================================
   ARCHWAYS
========================================================= */

function arch(x,z,rot=0){

    const group=new THREE.Group();

    const side1=new THREE.Mesh(
        new THREE.BoxGeometry(1.5,7,2),
        stoneMaterial()
    );

    side1.position.set(-2.5,3.5,0);

    const side2=side1.clone();

    side2.position.x=2.5;

    const top=new THREE.Mesh(
        new THREE.BoxGeometry(6.5,2,2),
        stoneMaterial()
    );

    top.position.y=7;

    group.add(side1,side2,top);

    group.position.set(x,0,z);
    group.rotation.y=rot;

    group.traverse(o=>{
        if(o.isMesh){
            o.castShadow=true;
            o.receiveShadow=true;
        }
    });

    dungeon.add(group);
}

arch(0,-20);
arch(0,20);
arch(-15,-3,Math.PI/2);
arch(15,-3,Math.PI/2);
arch(-15,17,Math.PI/2);
arch(15,17,Math.PI/2);

/* =========================================================
   PLAYER
========================================================= */

const player=new THREE.Group();

player.position.set(0,0,30);

scene.add(player);

/* body */

const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(.65,1.5,8,16),
    new THREE.MeshStandardMaterial({
        color:0x20252d,
        roughness:.7
    })
);

body.position.y=1.6;
body.castShadow=true;

player.add(body);

/* armor */

const armor=new THREE.Mesh(
    new THREE.BoxGeometry(1.2,1.5,.7),
    new THREE.MeshStandardMaterial({
        color:0x303641,
        metalness:.5,
        roughness:.45
    })
);

armor.position.y=1.8;
armor.castShadow=true;

player.add(armor);

/* head */

const head=new THREE.Mesh(
    new THREE.SphereGeometry(.48,16,16),
    new THREE.MeshStandardMaterial({
        color:0x9a6b50,
        roughness:.8
    })
);

head.position.y=3.05;
head.castShadow=true;

player.add(head);

/* helmet */

const helmet=new THREE.Mesh(
    new THREE.SphereGeometry(.54,16,12,0,Math.PI*2,0,Math.PI/2),
    new THREE.MeshStandardMaterial({
        color:0x15191f,
        metalness:.75,
        roughness:.3
    })
);

helmet.position.y=3.18;

helmet.castShadow=true;

player.add(helmet);

/* shoulders */

const shoulderMat=new THREE.MeshStandardMaterial({
    color:0x424b57,
    metalness:.6,
    roughness:.4
});

const shoulderL=new THREE.Mesh(
    new THREE.SphereGeometry(.38,12,12),
    shoulderMat
);

shoulderL.position.set(-.75,2.25,0);

player.add(shoulderL);

const shoulderR=shoulderL.clone();

shoulderR.position.x=.75;

player.add(shoulderR);

/* =========================================================
   SWORD
========================================================= */

const sword=new THREE.Group();

const blade=new THREE.Mesh(
    new THREE.BoxGeometry(.13,2.7,.28),
    new THREE.MeshStandardMaterial({
        color:0xbfc5cf,
        metalness:.9,
        roughness:.18
    })
);

blade.position.y=1.5;

sword.add(blade);

const guard=new THREE.Mesh(
    new THREE.BoxGeometry(1.1,.16,.18),
    metalMat
);

guard.position.y=.15;

sword.add(guard);

const grip=new THREE.Mesh(
    new THREE.CylinderGeometry(.12,.12,.8,8),
    woodMat
);

grip.position.y=-.25;

sword.add(grip);

sword.rotation.z=-.3;
sword.position.set(.95,1.8,-.1);

player.add(sword);

/* =========================================================
   ENEMIES
========================================================= */

const enemies=[];

function createEnemy(x,z,boss=false){

    const enemy=new THREE.Group();

    enemy.position.set(x,0,z);

    const enemyMat=new THREE.MeshStandardMaterial({
        color:boss?0x351018:0x29252a,
        roughness:.8,
        metalness:.15
    });

    const chest=new THREE.Mesh(
        new THREE.BoxGeometry(
            boss?1.5:1.05,
            boss?2.2:1.6,
            boss?1:0.75
        ),
        enemyMat
    );

    chest.position.y=boss?1.7:1.35;
    chest.castShadow=true;

    enemy.add(chest);

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(
            boss?.65:.45,
            16,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:boss?0x5b1718:0x56403a,
            roughness:.9
        })
    );

    head.position.y=boss?3.35:2.55;
    head.castShadow=true;

    enemy.add(head);

    /* eyes */

    const eyeMat=new THREE.MeshBasicMaterial({
        color:0xff1d19
    });

    const eye1=new THREE.Mesh(
        new THREE.SphereGeometry(.07,8,8),
        eyeMat
    );

    const eye2=eye1.clone();

    eye1.position.set(-.18,boss?3.43:2.62,-.39);
    eye2.position.set(.18,boss?3.43:2.62,-.39);

    enemy.add(eye1,eye2);

    /* weapon */

    const weapon=new THREE.Mesh(
        new THREE.BoxGeometry(.12,boss?2.7:2,.18),
        new THREE.MeshStandardMaterial({
            color:0x969ba2,
            metalness:.9,
            roughness:.2
        })
    );

    weapon.position.set(
        boss?1.15:.8,
        boss?1.6:1.4,
        -.15
    );

    weapon.rotation.z=-.45;

    weapon.castShadow=true;

    enemy.add(weapon);

    scene.add(enemy);

    enemies.push({
        mesh:enemy,
        health:boss?160:45,
        maxHealth:boss?160:45,
        boss,
        alive:true,
        attackTimer:0
    });

    if(boss){

        document.getElementById("boss").style.display="block";

    }
}

/* enemies */

createEnemy(-7,-10);
createEnemy(7,-10);
createEnemy(-26,8);
createEnemy(26,8);
createEnemy(-7,25);
createEnemy(7,25);

createEnemy(0,-32,true);

/* =========================================================
   GAME VARIABLES
========================================================= */

let health=100;
let level=1;
let souls=0;

let attacking=false;
let attackCooldown=0;

const keys={};

let cameraYaw=0;

let started=false;

/* =========================================================
   INPUT
========================================================= */

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.code==="Space"){
        e.preventDefault();
        attack();
    }

});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

renderer.domElement.addEventListener("click",()=>{

    if(started){
        renderer.domElement.requestPointerLock();
    }

});

document.addEventListener("mousemove",e=>{

    if(document.pointerLockElement===renderer.domElement){

        cameraYaw-=e.movementX*.0025;

    }

});

/* =========================================================
   START
========================================================= */

document.getElementById("startButton").onclick=()=>{

    started=true;

    document.getElementById("start").style.display="none";

    renderer.domElement.requestPointerLock();

};

/* =========================================================
   RESTART
========================================================= */

document.getElementById("restart").onclick=()=>{

    location.reload();

};

/* =========================================================
   ATTACK
========================================================= */

function attack(){

    if(!started || attackCooldown>0 || health<=0) return;

    attackCooldown=.55;

    attacking=true;

    const startRot=sword.rotation.z;

    sword.rotation.z=-1.3;

    setTimeout(()=>{

        sword.rotation.z=startRot;
        attacking=false;

    },220);

    let nearest=null;
    let nearestDistance=3.8;

    enemies.forEach(enemy=>{

        if(!enemy.alive)return;

        const d=player.position.distanceTo(enemy.mesh.position);

        if(d<nearestDistance){

            nearest=enemy;
            nearestDistance=d;

        }

    });

    if(nearest){

        nearest.health-=35;

        showMessage(
            nearest.boss
            ?"CRITICAL HIT!"
            :"Enemy struck!"
        );

        if(nearest.health<=0){

            killEnemy(nearest);

        }

    }

}

/* =========================================================
   ENEMY DEATH
========================================================= */

function killEnemy(enemy){

    enemy.alive=false;

    souls+=enemy.boss?100:20;

    document.getElementById("souls").textContent=souls;

    if(enemy.boss){

        document.getElementById("boss").style.display="none";

        showMessage("THE BOSS HAS FALLEN");

    }else{

        showMessage("ENEMY DEFEATED");

    }

    let t=0;

    const fade=setInterval(()=>{

        t+=.05;

        enemy.mesh.scale.multiplyScalar(.94);

        enemy.mesh.position.y-=.02;

        if(t>1){

            clearInterval(fade);
            scene.remove(enemy.mesh);

        }

    },30);

}

/* =========================================================
   PLAYER DAMAGE
========================================================= */

function hurt(amount){

    health-=amount;

    health=Math.max(0,health);

    document.getElementById("health").style.width=
        health+"%";

    const damage=document.getElementById("damage");

    damage.style.opacity=".7";

    setTimeout(()=>{
        damage.style.opacity="0";
    },120);

    if(health<=0){

        gameOver();

    }

}

/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    document.exitPointerLock();

    document.getElementById("gameOver").style.display="flex";

}

/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(dt){

    enemies.forEach(enemy=>{

        if(!enemy.alive)return;

        const target=player.position;

        const dx=target.x-enemy.mesh.position.x;
        const dz=target.z-enemy.mesh.position.z;

        const distance=Math.sqrt(dx*dx+dz*dz);

        if(distance<25 && distance>2.4){

            const speed=enemy.boss?1.15:.8;

            enemy.mesh.position.x+=(dx/distance)*speed*dt;
            enemy.mesh.position.z+=(dz/distance)*speed*dt;

        }

        if(distance<=2.5){

            enemy.attackTimer-=dt;

            if(enemy.attackTimer<=0){

                enemy.attackTimer=1.3;

                hurt(enemy.boss?15:7);

            }

        }

        enemy.mesh.lookAt(
            player.position.x,
            enemy.mesh.position.y+1.4,
            player.position.z
        );

        if(enemy.boss){

            const pct=Math.max(
                0,
                enemy.health/enemy.maxHealth*100
            );

            document.getElementById("bossHealth")
                .style.width=pct+"%";

        }

    });

}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(dt){

    if(!started)return;

    let forward=0;
    let sideways=0;

    if(keys["w"]||keys["arrowup"])forward+=1;
    if(keys["s"]||keys["arrowdown"])forward-=1;
    if(keys["a"]||keys["arrowleft"])sideways-=1;
    if(keys["d"]||keys["arrowright"])sideways+=1;

    if(!forward&&!sideways)return;

    const length=Math.sqrt(
        forward*forward+
        sideways*sideways
    );

    forward/=length;
    sideways/=length;

    const speed=5;

    const sin=Math.sin(cameraYaw);
    const cos=Math.cos(cameraYaw);

    const dx=
        (sideways*cos+forward*sin)*
        speed*dt;

    const dz=
        (sideways*sin-forward*cos)*
        speed*dt;

    player.position.x+=dx;
    player.position.z+=dz;

    /* dungeon boundaries */

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -36,
            36
        );

    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -36,
            36
        );

}

/* =========================================================
   THIRD PERSON CAMERA
========================================================= */

function updateCamera(){

    const distance=7;
    const height=4.5;

    const target=new THREE.Vector3(
        player.position.x,
        player.position.y+2.0,
        player.position.z
    );

    const camX=
        player.position.x-
        Math.sin(cameraYaw)*distance;

    const camZ=
        player.position.z-
        Math.cos(cameraYaw)*distance;

    camera.position.lerp(
        new THREE.Vector3(
            camX,
            height,
            camZ
        ),
        .12
    );

    camera.lookAt(target);

}

/* =========================================================
   TORCH FLICKER
========================================================= */

let elapsed=0;

function updateTorches(){

    torchLights.forEach((t,i)=>{

        const flicker=
            Math.sin(elapsed*8+i*4)*.35+
            Math.sin(elapsed*17+i)*.18;

        t.light.intensity=3+flicker;

        const s=
            1+
            Math.sin(elapsed*12+i)*.12;

        t.fire.scale.set(
            .7*s,
            1.3/s,
            .7*s
        );

    });

}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=0;

function showMessage(text){

    const el=document.getElementById("message");

    el.textContent=text;
    el.style.opacity="1";

    messageTimer=2;

}

/* =========================================================
   ANIMATION
========================================================= */

const clock=new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const dt=Math.min(
        clock.getDelta(),
        .05
    );

    elapsed+=dt;

    if(attackCooldown>0){
        attackCooldown-=dt;
    }

    if(messageTimer>0){

        messageTimer-=dt;

        if(messageTimer<=0){

            document.getElementById("message")
                .style.opacity="0";

        }

    }

    movePlayer(dt);
    updateEnemies(dt);
    updateCamera();
    updateTorches();

    renderer.render(scene,camera);

}

animate();

/* =========================================================
   RESIZE
========================================================= */

addEventListener("resize",()=>{

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

});

</script>
