<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Bread Quest - World Map</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(#15152e, #25245a);
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 20px 10px 10px;
}

header h1 {
    margin: 0;
    font-size: 36px;
}

header p {
    margin: 8px 0;
    color: #cfcfff;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 15px;
}

.stat {
    background: rgba(255,255,255,0.12);
    padding: 10px 16px;
    border-radius: 14px;
}

.map {
    position: relative;
    width: min(1100px, 94%);
    height: 650px;
    margin: 20px auto;
    overflow: hidden;
    border-radius: 30px;
    border: 4px solid rgba(255,255,255,0.25);
    background:
        linear-gradient(#73d7ff 0 52%, #72bd4e 52% 100%);
    box-shadow: 0 15px 45px rgba(0,0,0,0.4);
}

.cloud {
    position: absolute;
    width: 100px;
    height: 35px;
    background: white;
    border-radius: 40px;
    opacity: .75;
}

.cloud:before,
.cloud:after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud:before {
    width: 50px;
    height: 50px;
    left: 15px;
    top: -25px;
}

.cloud:after {
    width: 45px;
    height: 45px;
    right: 15px;
    top: -20px;
}

.cloud1 {
    left: 8%;
    top: 12%;
}

.cloud2 {
    left: 55%;
    top: 8%;
}

.cloud3 {
    right: 8%;
    top: 25%;
}

.path {
    position: absolute;
    left: 8%;
    right: 8%;
    top: 50%;
    height: 18px;
    background: #d69a52;
    border-radius: 20px;
    transform: rotate(-2deg);
}

.level {
    position: absolute;
    width: 70px;
    height: 70px;

    border: 5px solid white;
    border-radius: 50%;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    background: #3ed35c;
    color: white;

    box-shadow: 0 6px 15px rgba(0,0,0,.35);

    transform: translate(-50%, -50%);
}

.level:hover {
    transform: translate(-50%, -50%) scale(1.1);
}

.level.locked {
    background: #555;
    cursor: not-allowed;
    opacity: .7;
}

.level.completed {
    background: #22a9ff;
}

.level.boss {
    background: #e63946;
}

.level .label {
    position: absolute;
    top: 78px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 14px;
    color: white;
    text-shadow: 0 2px 3px black;
}

.level1 {
    left: 10%;
    top: 68%;
}

.level2 {
    left: 25%;
    top: 50%;
}

.level3 {
    left: 40%;
    top: 65%;
}

.level4 {
    left: 55%;
    top: 48%;
}

.level5 {
    left: 68%;
    top: 65%;
}

.level6 {
    left: 78%;
    top: 45%;
}

.level7 {
    left: 85%;
    top: 68%;
}

.level8 {
    left: 62%;
    top: 82%;
}

.level9 {
    left: 42%;
    top: 84%;
}

.level10 {
    left: 22%;
    top: 82%;
}

.bottomButtons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 10px 30px;
}

.bottomButtons button {
    border: none;
    border-radius: 14px;
    padding: 13px 20px;

    font-weight: bold;
    font-size: 15px;

    cursor: pointer;

    background: #ffcc33;
    color: #382700;

    box-shadow: 0 4px 0 #b98d00;
}

.bottomButtons button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #b98d00;
}

@media (max-width: 600px) {

    header h1 {
        font-size: 28px;
    }

    .map {
        height: 570px;
    }

    .level {
        width: 58px;
        height: 58px;
        font-size: 16px;
    }

    .level .label {
        top: 64px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🍞 The Bread Quest</h1>
    <p>🗺️ World Map — World 1: 🌾 Breadlands</p>
</header>

<div class="stats">

    <div class="stat">
        ⭐ Stars:
        <span id="stars">0</span>
    </div>

    <div class="stat">
        🏆 Completed:
        <span id="completed">0</span>/10
    </div>

    <div class="stat">
        🔓 Unlocked:
        <span id="unlocked">3</span>/10
    </div>

</div>

<div class="map">

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div class="path"></div>

    <button class="level level1" onclick="openLevel(1)">
        1
        <span class="label">🌾 Start</span>
    </button>

    <button class="level level2" onclick="openLevel(2)">
        2
        <span class="label">🍞 Toasty Trail</span>
    </button>

    <button class="level level3" onclick="openLevel(3)">
        3
        <span class="label">🥖 Breadlands Dash</span>
    </button>

    <button class="level level4" onclick="openLevel(4)">
        4
        <span class="label">🔒 Locked</span>
    </button>

    <button class="level level5" onclick="openLevel(5)">
        5
        <span class="label">🔒 Locked</span>
    </button>

    <button class="level level6" onclick="openLevel(6)">
        6
        <span class="label">🔒 Locked</span>
    </button>

    <button class="level level7" onclick="openLevel(7)">
        7
        <span class="label">🔒 Locked</span>
    </button>

    <button class="level level8" onclick="openLevel(8)">
        8
        <span class="label">🔒 Locked</span>
    </button>

    <button class="level level9" onclick="openLevel(9)">
        9
        <span class="label">🔒 Locked</span>
    </button>

    <button class="level level10 boss" onclick="openLevel(10)">
        10
        <span class="label">👑 Boss</span>
    </button>

</div>

<div class="bottomButtons">

    <button onclick="openLevel(1)">
        🍞 Level 1
    </button>

    <button onclick="openLevel(2)">
        🍞 Level 2
    </button>

    <button onclick="openLevel(3)">
        🥖 Level 3
    </button>

    <button onclick="window.location.href='/snake-game/'">
        🏠 Back to Arcade
    </button>

</div>

<script>

let completed = Number(
    localStorage.getItem("breadQuestCompleted") || 1
);

let unlocked = Number(
    localStorage.getItem("breadQuestUnlocked") || 3
);

/*
    Level 3 is available because Level 2
    has been completed.
*/
unlocked = Math.max(unlocked, 3);


// ------------------------------------------------------
// UPDATE MAP
// ------------------------------------------------------

function updateMap() {

    document.getElementById("completed").textContent =
        completed;

    document.getElementById("unlocked").textContent =
        Math.min(unlocked, 10);

    const levels =
        document.querySelectorAll(".level");

    levels.forEach((button, index) => {

        const levelNumber = index + 1;

        button.classList.remove("locked");
        button.classList.remove("completed");

        if (levelNumber <= completed) {

            button.classList.add("completed");

        } else if (levelNumber > unlocked) {

            button.classList.add("locked");

        }

        const label =
            button.querySelector(".label");

        if (levelNumber <= completed) {

            label.textContent = "✅ Complete";

        } else if (levelNumber > unlocked) {

            label.textContent = "🔒 Locked";

        } else if (levelNumber === 1) {

            label.textContent = "🌾 Start";

        } else if (levelNumber === 2) {

            label.textContent = "🍞 Toasty Trail";

        } else if (levelNumber === 3) {

            label.textContent = "🥖 Breadlands Dash";

        } else {

            label.textContent = "▶ Play";
        }
    });
}


// ------------------------------------------------------
// OPEN LEVEL
// ------------------------------------------------------

function openLevel(level) {

    if (level > unlocked) {

        alert(
            "🔒 This level is locked!\n\n" +
            "Complete the previous levels first."
        );

        return;
    }

    if (level === 1) {

        window.location.href =
            "/snake-game/games/bread-quest/index.html";

        return;
    }

    if (level === 2) {

        window.location.href =
            "/snake-game/games/bread-quest/level2.html";

        return;
    }

if (level === 3) {
    window.location.href =
        "/snake-game/games/bread-quest/level3.html";

    return;
}
    if (level === 4) {
    window.location.href =
        "/snake-game/games/bread-quest/level4.html";

    return;
}if (level === 5) {
    window.location.href =
        "/snake-game/games/bread-quest/level5.html";

    return;
}if (level === 6) {
    window.location.href =
        "/snake-game/games/bread-quest/level6.html";
    return;
}
     

    alert(
        "🍞 Level " + level +
        " is coming soon!"
    );
}


// ------------------------------------------------------
// START MAP
// ------------------------------------------------------

updateMap();

</script>

</body>
</html>
