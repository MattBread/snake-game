<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Bread Quest - Level 5</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(#bde7ff, #eefaff);
    font-family: Arial, sans-serif;
    user-select: none;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    color: white;
    background: rgba(20, 40, 70, 0.8);
    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 18px;
    font-weight: bold;
}

#message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    display: none;
    text-align: center;
    color: white;
    background: rgba(10, 25, 50, 0.95);
    border: 3px solid white;
    border-radius: 18px;
    padding: 30px;
    min-width: 320px;
}

#message h1 {
    margin-top: 0;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    margin: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#mobileControls {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    z-index: 15;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
}

.controlGroup {
    display: flex;
    gap: 10px;
    pointer-events: auto;
}

.control {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: rgba(30, 50, 80, 0.8);
    color: white;
    border: 2px solid rgba(255,255,255,0.8);
    font-size: 25px;
    touch-action: none;
}

@media (min-width: 900px) {
    #mobileControls {
        opacity: 0.45;
    }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
    ❄️ Frosted Freezer |
    ❤️ Lives: <span id="lives">3</span> |
    🪙 Coins: <span id="coins">0</span> |
    ⭐ Score: <span id="score">0</span>
</div>

<div id="message">
    <h1 id="messageTitle"></h1>
    <p id="messageText"></p>

    <button onclick="restartLevel()">🔄 Restart</button>
    <button onclick="goLevel4()">⬅️ Level 4</button>
    <button onclick="goWorldMap()">🗺️ World Map</button>
    <button onclick="goArcade()">🏠 Arcade</button>
</div>

<div id="mobileControls">

    <div class="controlGroup">
        <button class="control" id="leftBtn">◀</button>
        <button class="control" id="rightBtn">▶</button>
    </div>

    <div class="controlGroup">
        <button class="control" id="jumpBtn">⬆</button>
    </div>

</div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================
   WORLD
========================= */

const WORLD_WIDTH = 7200;

const platforms = [

    { x: 0,    y: 520, w: 750,  h: 80, ice: false },
    { x: 850,  y: 520, w: 600,  h: 80, ice: true },
    { x: 1550, y: 520, w: 650,  h: 80, ice: false },
    { x: 2300, y: 520, w: 550,  h: 80, ice: true },
    { x: 2950, y: 520, w: 750,  h: 80, ice: false },
    { x: 3800, y: 520, w: 600,  h: 80, ice: true },
    { x: 4500, y: 520, w: 700,  h: 80, ice: false },
    { x: 5300, y: 520, w: 600,  h: 80, ice: true },
    { x: 6000, y: 520, w: 1200, h: 80, ice: false }

];

const gaps = [

    { x: 750,  w: 100 },
    { x: 1450, w: 100 },
    { x: 2200, w: 100 },
    { x: 2850, w: 100 },
    { x: 3700, w: 100 },
    { x: 4400, w: 100 },
    { x: 5200, w: 100 },
    { x: 5900, w: 100 }

];


/* =========================
   PLAYER
========================= */

const player = {

    x: 100,
    y: 400,

    width: 42,
    height: 58,

    vx: 0,
    vy: 0,

    speed: 0.65,
    maxSpeed: 7,

    jumpPower: 15,

    grounded: false,
    onIce: false

};


/* =========================
   GAME STATE
========================= */

let lives = 3;
let coinsCollected = 0;
let score = 0;

let cameraX = 0;

let gameOver = false;
let levelComplete = false;

const keys = {};


/* =========================
   COINS
========================= */

const coins = [

    { x: 300,  y: 440, collected: false },
    { x: 500,  y: 390, collected: false },
    { x: 690,  y: 430, collected: false },

    { x: 1000, y: 430, collected: false },
    { x: 1200, y: 380, collected: false },
    { x: 1400, y: 430, collected: false },

    { x: 1700, y: 430, collected: false },
    { x: 1950, y: 370, collected: false },
    { x: 2150, y: 430, collected: false },

    { x: 2450, y: 430, collected: false },
    { x: 2650, y: 370, collected: false },

    { x: 3150, y: 430, collected: false },
    { x: 3400, y: 380, collected: false },
    { x: 3600, y: 430, collected: false },

    { x: 3950, y: 430, collected: false },
    { x: 4200, y: 380, collected: false },

    { x: 4700, y: 430, collected: false },
    { x: 4950, y: 380, collected: false },
    { x: 5150, y: 430, collected: false },

    { x: 5450, y: 430, collected: false },
    { x: 5650, y: 380, collected: false },

    { x: 6200, y: 430, collected: false },
    { x: 6500, y: 380, collected: false },
    { x: 6800, y: 430, collected: false }

];


/* =========================
   ENEMIES
========================= */

const enemies = [

    {
        x: 600,
        y: 465,
        w: 42,
        h: 55,
        vx: 1.5,
        minX: 400,
        maxX: 700
    },

    {
        x: 1100,
        y: 465,
        w: 42,
        h: 55,
        vx: -1.5,
        minX: 900,
        maxX: 1400
    },

    {
        x: 1800,
        y: 465,
        w: 42,
        h: 55,
        vx: 1.5,
        minX: 1600,
        maxX: 2150
    },

    {
        x: 2500,
        y: 465,
        w: 42,
        h: 55,
        vx: -1.7,
        minX: 2350,
        maxX: 2800
    },

    {
        x: 3200,
        y: 465,
        w: 42,
        h: 55,
        vx: 1.7,
        minX: 3000,
        maxX: 3650
    },

    {
        x: 3950,
        y: 465,
        w: 42,
        h: 55,
        vx: -1.7,
        minX: 3850,
        maxX: 4350
    },

    {
        x: 4700,
        y: 465,
        w: 42,
        h: 55,
        vx: 1.8,
        minX: 4550,
        maxX: 5100
    },

    {
        x: 5450,
        y: 465,
        w: 42,
        h: 55,
        vx: -1.8,
        minX: 5350,
        maxX: 5850
    },

    {
        x: 6400,
        y: 465,
        w: 42,
        h: 55,
        vx: 1.8,
        minX: 6100,
        maxX: 6900
    }

];


/* =========================
   COLLISION
========================= */

function rectsCollide(a, b) {

    const aw = a.width ?? a.w;
    const ah = a.height ?? a.h;

    const bw = b.width ?? b.w;
    const bh = b.height ?? b.h;

    return (

        a.x < b.x + bw &&
        a.x + aw > b.x &&
        a.y < b.y + bh &&
        a.y + ah > b.y

    );

}


/* =========================
   INPUT
========================= */

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (
        e.key === "ArrowUp" ||
        e.key === " " ||
        e.key.toLowerCase() === "w"
    ) {

        jump();

        e.preventDefault();

    }

});


window.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

});


/* =========================
   JUMP
========================= */

function jump() {

    if (gameOver || levelComplete) return;

    if (player.grounded) {

        player.vy = -player.jumpPower;
        player.grounded = false;

    }

}


/* =========================
   MOBILE CONTROLS
========================= */

function holdButton(button, key) {

    button.addEventListener("touchstart", e => {

        e.preventDefault();

        keys[key] = true;

    }, { passive: false });


    button.addEventListener("touchend", e => {

        e.preventDefault();

        keys[key] = false;

    }, { passive: false });

}


holdButton(
    document.getElementById("leftBtn"),
    "arrowleft"
);

holdButton(
    document.getElementById("rightBtn"),
    "arrowright"
);


document.getElementById("jumpBtn")
.addEventListener("touchstart", e => {

    e.preventDefault();

    jump();

}, { passive: false });


/* =========================
   RESET PLAYER
========================= */

function resetPlayer() {

    player.x = 100;
    player.y = 400;

    player.vx = 0;
    player.vy = 0;

}


/* =========================
   LOSE LIFE
========================= */

function loseLife() {

    lives--;

    updateHUD();

    if (lives <= 0) {

        showGameOver();

        return;

    }

    resetPlayer();

}


/* =========================
   GAME OVER
========================= */

function showGameOver() {

    gameOver = true;

    document.getElementById("messageTitle")
        .textContent = "💀 GAME OVER";

    document.getElementById("messageText")
        .textContent =
        "The Frosted Freezer got you!";

    document.getElementById("message")
        .style.display = "block";

}


/* =========================
   COMPLETE LEVEL
========================= */

function completeLevel() {

    if (levelComplete) return;

    levelComplete = true;

    localStorage.setItem(
        "breadQuestCompleted",
        "5"
    );

    localStorage.setItem(
        "breadQuestUnlocked",
        "6"
    );

    document.getElementById("messageTitle")
        .textContent =
        "🏆 LEVEL 5 COMPLETE!";

    document.getElementById("messageText")
        .textContent =
        "You escaped the Frosted Freezer! Level 6 unlocked!";

    document.getElementById("message")
        .style.display = "block";

}


/* =========================
   RESTART
========================= */

function restartLevel() {

    location.reload();

}


/* =========================
   NAVIGATION
========================= */

function goLevel4() {

    window.location.href =
        "/snake-game/games/bread-quest/level4.html";

}


function goWorldMap() {

    window.location.href =
        "/snake-game/games/bread-quest/world-map.html";

}


function goArcade() {

    window.location.href =
        "/snake-game/";

}


/* =========================
   HUD
========================= */

function updateHUD() {

    document.getElementById("lives")
        .textContent = lives;

    document.getElementById("coins")
        .textContent = coinsCollected;

    document.getElementById("score")
        .textContent = score;

}


/* =========================
   UPDATE
========================= */

function update() {

    if (gameOver || levelComplete) return;


    /* MOVEMENT */

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {

        player.vx += player.speed;

    }

    else if (
        keys["arrowleft"] ||
        keys["a"]
    ) {

        player.vx -= player.speed;

    }

    else {

        if (player.onIce) {

            player.vx *= 0.985;

        } else {

            player.vx *= 0.8;

        }

    }


    if (player.vx > player.maxSpeed) {
        player.vx = player.maxSpeed;
    }

    if (player.vx < -player.maxSpeed) {
        player.vx = -player.maxSpeed;
    }


    player.x += player.vx;


    /* GRAVITY */

    player.vy += 0.7;

    if (player.vy > 18) {
        player.vy = 18;
    }

    player.y += player.vy;


    player.grounded = false;
    player.onIce = false;


    /* PLATFORM COLLISION */

    for (const platform of platforms) {

        if (

            player.x + player.width > platform.x &&
            player.x < platform.x + platform.w &&
            player.y + player.height >= platform.y &&
            player.y + player.height <= platform.y + 30 &&
            player.vy >= 0

        ) {

            player.y =
                platform.y - player.height;

            player.vy = 0;

            player.grounded = true;

            player.onIce = platform.ice;

        }

    }


    /* WORLD BOUNDS */

    if (player.x < 0) {

        player.x = 0;

        player.vx = 0;

    }


    if (player.x > WORLD_WIDTH - player.width) {

        player.x =
            WORLD_WIDTH - player.width;

    }


    /* FALL INTO SNOW GAP */

    if (player.y > canvas.height + 100) {

        loseLife();

    }


    /* ENEMIES */

    for (const enemy of enemies) {

        enemy.x += enemy.vx;

        if (
            enemy.x <= enemy.minX ||
            enemy.x + enemy.w >= enemy.maxX
        ) {

            enemy.vx *= -1;

        }


        const enemyBox = {

            x: enemy.x,
            y: enemy.y,
            w: enemy.w,
            h: enemy.h

        };


        if (rectsCollide(player, enemyBox)) {

            if (
                player.vy > 0 &&
                player.y + player.height <
                enemy.y + 25
            ) {

                enemy.y = 10000;

                player.vy = -10;

                score += 100;

            }

            else {

                loseLife();

                break;

            }

        }

    }


    /* COINS */

    for (const coin of coins) {

        if (coin.collected) continue;


        const coinBox = {

            x: coin.x - 12,
            y: coin.y - 12,
            w: 24,
            h: 24

        };


        if (rectsCollide(player, coinBox)) {

            coin.collected = true;

            coinsCollected++;

            score += 25;

            updateHUD();

        }

    }


    /* GOAL */

    const goal = {

        x: 7050,
        y: 390,
        w: 50,
        h: 130

    };


    if (rectsCollide(player, goal)) {

        completeLevel();

    }


    /* CAMERA */

    cameraX =
        player.x -
        canvas.width * 0.35;


    if (cameraX < 0) {

        cameraX = 0;

    }


    if (
        cameraX >
        WORLD_WIDTH - canvas.width
    ) {

        cameraX =
            WORLD_WIDTH - canvas.width;

    }


    updateHUD();

}


/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    gradient.addColorStop(
        0,
        "#8ed8ff"
    );

    gradient.addColorStop(
        1,
        "#edfaff"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* SNOW */

    ctx.fillStyle =
        "rgba(255,255,255,0.8)";

    for (
        let i = 0;
        i < 80;
        i++
    ) {

        const x =
            (i * 173 -
             cameraX * 0.2) %
            canvas.width;

        const y =
            (i * 97) %
            canvas.height;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2 + (i % 3),
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /* MOUNTAINS */

    ctx.fillStyle =
        "rgba(120,180,220,0.35)";

    for (
        let i = -1;
        i < 12;
        i++
    ) {

        const x =
            i * 500 -
            (cameraX * 0.25);

        ctx.beginPath();

        ctx.moveTo(
            x,
            420
        );

        ctx.lineTo(
            x + 250,
            150
        );

        ctx.lineTo(
            x + 500,
            420
        );

        ctx.closePath();

        ctx.fill();

    }

}


/* =========================
   DRAW PLATFORMS
========================= */

function drawPlatforms() {

    for (const platform of platforms) {

        const x =
            platform.x - cameraX;

        ctx.fillStyle =
            platform.ice
                ? "#b9f4ff"
                : "#ffffff";

        ctx.fillRect(
            x,
            platform.y,
            platform.w,
            platform.h
        );


        ctx.fillStyle =
            platform.ice
                ? "#65d9ff"
                : "#d8ecf5";

        ctx.fillRect(
            x,
            platform.y,
            platform.w,
            12
        );


        if (platform.ice) {

            ctx.strokeStyle =
                "rgba(255,255,255,0.9)";

            ctx.lineWidth = 3;

            for (
                let i = 20;
                i < platform.w;
                i += 70
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    x + i,
                    platform.y + 15
                );

                ctx.lineTo(
                    x + i + 25,
                    platform.y + 35
                );

                ctx.stroke();

            }

        }

    }

}


/* =========================
   DRAW COINS
========================= */

function drawCoins() {

    for (const coin of coins) {

        if (coin.collected) continue;


        const x =
            coin.x - cameraX;


        ctx.fillStyle =
            "#ffd83d";

        ctx.beginPath();

        ctx.arc(
            x,
            coin.y,
            11,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.strokeStyle =
            "#fff4a3";

        ctx.lineWidth = 3;

        ctx.stroke();


        ctx.fillStyle =
            "#fff8c4";

        ctx.font =
            "bold 13px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "$",
            x,
            coin.y + 5
        );

    }

}


/* =========================
   DRAW ENEMIES
========================= */

function drawEnemies() {

    for (const enemy of enemies) {

        if (enemy.y > 9000) continue;


        const x =
            enemy.x - cameraX;


        ctx.fillStyle =
            "#8b5cf6";

        ctx.beginPath();

        ctx.roundRect(
            x,
            enemy.y,
            enemy.w,
            enemy.h,
            12
        );

        ctx.fill();


        ctx.fillStyle =
            "white";

        ctx.beginPath();

        ctx.arc(
            x + 12,
            enemy.y + 18,
            7,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 30,
            enemy.y + 18,
            7,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
            "#222";

        ctx.beginPath();

        ctx.arc(
            x + 12,
            enemy.y + 18,
            3,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 30,
            enemy.y + 18,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer() {

    const x =
        player.x - cameraX;


    /* BODY */

    ctx.fillStyle =
        "#d28b45";

    ctx.fillRect(
        x,
        player.y + 15,
        player.width,
        player.height - 15
    );


    /* CRUST */

    ctx.strokeStyle =
        "#8b5428";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        x,
        player.y + 15,
        player.width,
        player.height - 15
    );


    /* TOP */

    ctx.fillStyle =
        "#f2bd6b";

    ctx.beginPath();

    ctx.roundRect(
        x + 2,
        player.y,
        player.width - 4,
        28,
        12
    );

    ctx.fill();


    /* FACE */

    ctx.fillStyle =
        "#222";

    ctx.beginPath();

    ctx.arc(
        x + 13,
        player.y + 13,
        3,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 29,
        player.y + 13,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* LEGS */

    ctx.fillStyle =
        "#51321c";

    ctx.fillRect(
        x + 5,
        player.y + player.height - 5,
        12,
        8
    );

    ctx.fillRect(
        x + 25,
        player.y + player.height - 5,
        12,
        8
    );

}


/* =========================
   DRAW GOAL
========================= */

function drawGoal() {

    const x =
        7050 - cameraX;


    ctx.fillStyle =
        "#6b4f2a";

    ctx.fillRect(
        x + 18,
        390,
        8,
        130
    );


    ctx.fillStyle =
        "#ff5b7f";

    ctx.beginPath();

    ctx.moveTo(
        x + 26,
        395
    );

    ctx.lineTo(
        x + 78,
        415
    );

    ctx.lineTo(
        x + 26,
        440
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 18px Arial";

    ctx.fillText(
        "LEVEL 5",
        x - 5,
        370
    );

}


/* =========================
   DRAW
========================= */

function draw() {

    drawBackground();

    ctx.save();

    drawPlatforms();

    drawCoins();

    drawEnemies();

    drawGoal();

    drawPlayer();

    ctx.restore();

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


updateHUD();

gameLoop();

</script>

</body>
</html>
