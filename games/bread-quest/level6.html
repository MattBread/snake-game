<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Bread Quest - Level 6</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #f6d58a;
    font-family: Arial, sans-serif;
    user-select: none;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    color: white;
    background: rgba(75, 40, 10, 0.85);
    border: 2px solid rgba(255, 235, 170, 0.9);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 18px;
    font-weight: bold;
}

#message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    display: none;
    text-align: center;
    color: white;
    background: rgba(55, 28, 5, 0.96);
    border: 3px solid #ffd76a;
    border-radius: 18px;
    padding: 30px;
    min-width: 330px;
}

#message h1 {
    margin-top: 0;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    margin: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#mobileControls {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    z-index: 15;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
}

.controlGroup {
    display: flex;
    gap: 10px;
    pointer-events: auto;
}

.control {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: rgba(75, 40, 10, 0.8);
    color: white;
    border: 2px solid rgba(255, 235, 170, 0.9);
    font-size: 25px;
    touch-action: none;
}

@media (min-width: 900px) {
    #mobileControls {
        opacity: 0.4;
    }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
    🏜️ Golden Oven Desert |
    ❤️ Lives: <span id="lives">3</span> |
    🪙 Coins: <span id="coins">0</span> |
    ⭐ Score: <span id="score">0</span>
</div>

<div id="message">
    <h1 id="messageTitle"></h1>
    <p id="messageText"></p>

    <button onclick="restartLevel()">🔄 Restart</button>
    <button onclick="goLevel5()">⬅️ Level 5</button>
    <button onclick="goWorldMap()">🗺️ World Map</button>
    <button onclick="goArcade()">🏠 Arcade</button>
</div>

<div id="mobileControls">

    <div class="controlGroup">
        <button class="control" id="leftBtn">◀</button>
        <button class="control" id="rightBtn">▶</button>
    </div>

    <div class="controlGroup">
        <button class="control" id="jumpBtn">⬆</button>
    </div>

</div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================
   WORLD
========================= */

const WORLD_WIDTH = 7600;

const platforms = [

    { x: 0,    y: 520, w: 700,  h: 80 },
    { x: 820,  y: 520, w: 580,  h: 80 },
    { x: 1520, y: 470, w: 650,  h: 130 },
    { x: 2290, y: 520, w: 520,  h: 80 },
    { x: 2930, y: 450, w: 700,  h: 150 },
    { x: 3750, y: 520, w: 550,  h: 80 },
    { x: 4420, y: 460, w: 650,  h: 140 },
    { x: 5170, y: 520, w: 600,  h: 80 },
    { x: 5870, y: 450, w: 650,  h: 150 },
    { x: 6620, y: 520, w: 980,  h: 80 }

];

const gaps = [

    { x: 700,  w: 120 },
    { x: 1400, w: 120 },
    { x: 2170, w: 120 },
    { x: 2810, w: 120 },
    { x: 3630, w: 120 },
    { x: 4300, w: 120 },
    { x: 5070, w: 100 },
    { x: 5770, w: 100 },
    { x: 6520, w: 100 }

];


/* =========================
   PLAYER
========================= */

const player = {

    x: 100,
    y: 400,

    width: 42,
    height: 58,

    vx: 0,
    vy: 0,

    speed: 0.65,
    maxSpeed: 7,

    jumpPower: 15,

    grounded: false

};


/* =========================
   GAME STATE
========================= */

let lives = 3;
let coinsCollected = 0;
let score = 0;

let cameraX = 0;

let gameOver = false;
let levelComplete = false;


/* =========================
   INPUT
========================= */

const keys = {};

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (
        e.key === "ArrowUp" ||
        e.key === " " ||
        e.key.toLowerCase() === "w"
    ) {

        jump();

        e.preventDefault();

    }

});

window.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

});


/* =========================
   PLAYER JUMP
========================= */

function jump() {

    if (gameOver || levelComplete) return;

    if (player.grounded) {

        player.vy = -player.jumpPower;

        player.grounded = false;

    }

}


/* =========================
   MOBILE CONTROLS
========================= */

function holdButton(button, key) {

    button.addEventListener(
        "touchstart",
        e => {

            e.preventDefault();

            keys[key] = true;

        },
        { passive: false }
    );

    button.addEventListener(
        "touchend",
        e => {

            e.preventDefault();

            keys[key] = false;

        },
        { passive: false }
    );

}

holdButton(
    document.getElementById("leftBtn"),
    "arrowleft"
);

holdButton(
    document.getElementById("rightBtn"),
    "arrowright"
);

document.getElementById("jumpBtn")
.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();

        jump();

    },
    { passive: false }
);


/* =========================
   COLLISION
========================= */

function rectsCollide(a, b) {

    const aw = a.width ?? a.w;
    const ah = a.height ?? a.h;

    const bw = b.width ?? b.w;
    const bh = b.height ?? b.h;

    return (
        a.x < b.x + bw &&
        a.x + aw > b.x &&
        a.y < b.y + bh &&
        a.y + ah > b.y
    );

}


/* =========================
   COINS
========================= */

const coins = [

    { x: 280,  y: 440, collected: false },
    { x: 480,  y: 390, collected: false },
    { x: 640,  y: 440, collected: false },

    { x: 930,  y: 440, collected: false },
    { x: 1130, y: 390, collected: false },
    { x: 1330, y: 440, collected: false },

    { x: 1630, y: 390, collected: false },
    { x: 1830, y: 340, collected: false },
    { x: 2050, y: 390, collected: false },

    { x: 2410, y: 440, collected: false },
    { x: 2600, y: 390, collected: false },
    { x: 2770, y: 440, collected: false },

    { x: 3100, y: 370, collected: false },
    { x: 3320, y: 320, collected: false },
    { x: 3520, y: 370, collected: false },

    { x: 3910, y: 440, collected: false },
    { x: 4100, y: 390, collected: false },

    { x: 4600, y: 380, collected: false },
    { x: 4800, y: 330, collected: false },
    { x: 5000, y: 380, collected: false },

    { x: 5320, y: 440, collected: false },
    { x: 5520, y: 390, collected: false },

    { x: 6030, y: 370, collected: false },
    { x: 6230, y: 320, collected: false },
    { x: 6420, y: 370, collected: false },

    { x: 6900, y: 440, collected: false },
    { x: 7150, y: 390, collected: false },
    { x: 7400, y: 440, collected: false }

];


/* =========================
   ENEMIES
========================= */

const enemies = [

    {
        x: 520,
        y: 465,
        w: 42,
        h: 55,
        vx: 1.4,
        minX: 300,
        maxX: 670
    },

    {
        x: 980,
        y: 465,
        w: 42,
        h: 55,
        vx: -1.5,
        minX: 850,
        maxX: 1370
    },

    {
        x: 1680,
        y: 415,
        w: 42,

        vx: 1.5,
        minX: 1540,
        maxX: 2140
    },

    {
        x: 2460,
        y: 465,
        w: 42,
        h: 55,

        minX: 2320,
        maxX: 2780
    },

    {
        x: 3100,

        minX: 2960,

    },

    {
        x: 3900,

    },

    {
        x: 4580,

        w: 42,

        vx: 1.7,

    },

    {
        x: 5350,
        y: 465,
        w: 42,
        h: 55,

        maxX: 5730
    },

    {
        x: 6040,
        y: 395,
        w: 42,
        h: 55,
        vx: 1.8,
        minX: 5890,
        maxX: 6490
    },

    {
        x: 6900,
        y: 465,
        w: 42,
        h: 55,
        vx: -1.8,
        minX: 6650,
        maxX: 7500
    }

];


/* =========================
   RESET PLAYER
========================= */

function resetPlayer() {

    player.x = 100;
    player.y = 400;

    player.vx = 0;
    player.vy = 0;

}


/* =========================
   LOSE LIFE
========================= */

function loseLife() {

    lives--;

    updateHUD();

    if (lives <= 0) {

        showGameOver();

        return;

    }

    resetPlayer();

}


/* =========================
   GAME OVER
========================= */

function showGameOver() {

    gameOver = true;

    document.getElementById("messageTitle")
        .textContent = "💀 GAME OVER";

    document.getElementById("messageText")
        .textContent =
        "The Golden Oven Desert defeated you!";

    document.getElementById("message")
        .style.display = "block";

}


/* =========================
   COMPLETE LEVEL
========================= */

function completeLevel() {

    if (levelComplete) return;

    levelComplete = true;

    localStorage.setItem(
        "breadQuestCompleted",
        "6"
    );

    localStorage.setItem(
        "breadQuestUnlocked",
        "7"
    );

    document.getElementById("messageTitle")
        .textContent =
        "🏆 LEVEL 6 COMPLETE!";

    document.getElementById("messageText")
        .textContent =
        "You conquered the Golden Oven Desert! Level 7 unlocked!";

    document.getElementById("message")
        .style.display = "block";

}


/* =========================
   RESTART
========================= */

function restartLevel() {

    location.reload();

}


/* =========================
   NAVIGATION
========================= */

function goLevel5() {

    window.location.href =
        "/snake-game/games/bread-quest/level5.html";

}

function goWorldMap() {

    window.location.href =
        "/snake-game/games/bread-quest/world-map.html";

}

function goArcade() {

    window.location.href =
        "/snake-game/";

}


/* =========================
   HUD
========================= */

function updateHUD() {

    document.getElementById("lives")
        .textContent = lives;

    document.getElementById("coins")
        .textContent = coinsCollected;

    document.getElementById("score")
        .textContent = score;

}


/* =========================
   UPDATE
========================= */

function update() {

    if (gameOver || levelComplete) return;


    /* MOVEMENT */

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {

        player.vx += player.speed;

    }
    else if (
        keys["arrowleft"] ||
        keys["a"]
    ) {

        player.vx -= player.speed;

    }
    else {

        player.vx *= 0.8;

    }


    if (player.vx > player.maxSpeed) {
        player.vx = player.maxSpeed;
    }

    if (player.vx < -player.maxSpeed) {
        player.vx = -player.maxSpeed;
    }


    player.x += player.vx;


    /* GRAVITY */

    player.vy += 0.7;

    if (player.vy > 18) {
        player.vy = 18;
    }

    player.y += player.vy;


    player.grounded = false;


    /* PLATFORM COLLISION */

    for (const platform of platforms) {

        if (
            player.x + player.width > platform.x &&
            player.x < platform.x + platform.w &&
            player.y + player.height >= platform.y &&
            player.y + player.height <= platform.y + 30 &&
            player.vy >= 0
        ) {

            player.y =
                platform.y - player.height;

            player.vy = 0;

            player.grounded = true;

        }

    }


    /* WORLD LIMITS */

    if (player.x < 0) {

        player.x = 0;
        player.vx = 0;

    }

    if (
        player.x >
        WORLD_WIDTH - player.width
    ) {

        player.x =
            WORLD_WIDTH - player.width;

    }


    /* FALLING */

    if (
        player.y >
        canvas.height + 100
    ) {

        loseLife();

    }


    /* ENEMIES */

    for (const enemy of enemies) {

        if (enemy.y > 9000) continue;

        enemy.x += enemy.vx;

        if (
            enemy.x <= enemy.minX ||
            enemy.x + enemy.w >= enemy.maxX
        ) {

            enemy.vx *= -1;

        }


        const enemyBox = {

            x: enemy.x,
            y: enemy.y,
            w: enemy.w,
            h: enemy.h

        };


        if (
            rectsCollide(
                player,
                enemyBox
            )
        ) {

            if (
                player.vy > 0 &&
                player.y + player.height <
                enemy.y + 25
            ) {

                enemy.y = 10000;

                player.vy = -10;

                score += 100;

            }
            else {

                loseLife();

                break;

            }

        }

    }


    /* COINS */

    for (const coin of coins) {

        if (coin.collected) continue;


        const coinBox = {

            x: coin.x - 12,
            y: coin.y - 12,
            w: 24,
            h: 24

        };


        if (
            rectsCollide(
                player,
                coinBox
            )
        ) {

            coin.collected = true;

            coinsCollected++;

            score += 25;

        }

    }


    /* GOAL */

    const goal = {

        x: 7480,
        y: 390,
        w: 50,
        h: 130

    };


    if (
        rectsCollide(
            player,
            goal
        )
    ) {

        completeLevel();

    }


    /* CAMERA */

    cameraX =
        player.x -
        canvas.width * 0.35;


    if (cameraX < 0) {

        cameraX = 0;

    }


    if (
        cameraX >
        WORLD_WIDTH - canvas.width
    ) {

        cameraX =
            WORLD_WIDTH - canvas.width;

    }


    updateHUD();

}


/* =========================
   BACKGROUND
========================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    gradient.addColorStop(
        0,
        "#f7c85c"
    );

    gradient.addColorStop(
        0.55,
        "#f4a63c"
    );

    gradient.addColorStop(
        1,
        "#d97a2b"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* SUN */

    ctx.fillStyle =
        "rgba(255,245,170,0.9)";

    ctx.beginPath();

    ctx.arc(
        canvas.width - 130,
        110,
        60,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* DISTANT DUNES */

    ctx.fillStyle =
        "rgba(180,95,35,0.35)";

    for (
        let i = -2;
        i < 15;
        i++
    ) {

        const x =
            i * 500 -
            cameraX * 0.2;

        ctx.beginPath();

        ctx.moveTo(
            x,
            500
        );

        ctx.quadraticCurveTo(
            x + 250,
            300,
            x + 500,
            500
        );

        ctx.lineTo(
            x + 500,
            canvas.height
        );

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.closePath();

        ctx.fill();

    }


    /* HEAT WAVES */

    ctx.strokeStyle =
        "rgba(255,235,160,0.25)";

    ctx.lineWidth = 3;

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const x =
            (i * 280 -
             cameraX * 0.1) %
            canvas.width;

        ctx.beginPath();

        ctx.moveTo(
            x,
            230 + i * 12
        );

        ctx.quadraticCurveTo(
            x + 40,
            215 + i * 12,
            x + 80,
            230 + i * 12
        );

        ctx.stroke();

    }

}


/* =========================
   PLATFORMS
========================= */

function drawPlatforms() {

    for (const platform of platforms) {

        const x =
            platform.x - cameraX;


        ctx.fillStyle =
            "#d78a35";

        ctx.fillRect(
            x,
            platform.y,
            platform.w,
            platform.h
        );


        ctx.fillStyle =
            "#f5c45d";

        ctx.fillRect(
            x,
            platform.y,
            platform.w,
            14
        );


        ctx.strokeStyle =
            "#9b5424";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            x,
            platform.y,
            platform.w,
            platform.h
        );


        /* SAND DETAILS */

        ctx.fillStyle =
            "rgba(120,60,20,0.3)";

        for (
            let i = 20;
            i < platform.w;
            i += 65
        ) {

            ctx.beginPath();

            ctx.arc(
                x + i,
                platform.y + 35,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

    }

}


/* =========================
   COINS
========================= */

function drawCoins() {

    for (const coin of coins) {

        if (coin.collected) continue;


        const x =
            coin.x - cameraX;


        ctx.fillStyle =
            "#ffd83d";

        ctx.beginPath();

        ctx.arc(
            x,
            coin.y,
            11,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.strokeStyle =
            "#fff1a3";

        ctx.lineWidth = 3;

        ctx.stroke();


        ctx.fillStyle =
            "#fff8c4";

        ctx.font =
            "bold 13px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "$",
            x,
            coin.y + 5
        );

    }

}


/* =========================
   ENEMIES
========================= */

function drawEnemies() {

    for (const enemy of enemies) {

        if (enemy.y > 9000) continue;


        const x =
            enemy.x - cameraX;


        ctx.fillStyle =
            "#9b4d20";

        ctx.beginPath();

        ctx.roundRect(
            x,
            enemy.y,
            enemy.w,
            enemy.h,
            10
        );

        ctx.fill();


        /* EYES */

        ctx.fillStyle =
            "white";

        ctx.beginPath();

        ctx.arc(
            x + 12,
            enemy.y + 18,
            7,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 30,
            enemy.y + 18,
            7,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
            "#222";

        ctx.beginPath();

        ctx.arc(
            x + 12,
            enemy.y + 18,
            3,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 30,
            enemy.y + 18,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* MUSTACHE */

        ctx.strokeStyle =
            "#4d2815";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(
            x + 10,
            enemy.y + 35
        );

        ctx.quadraticCurveTo(
            x + 21,
            enemy.y + 28,
            x + 21,
            enemy.y + 38
        );

        ctx.quadraticCurveTo(
            x + 21,
            enemy.y + 28,
            x + 32,
            enemy.y + 35
        );

        ctx.stroke();

    }

}


/* =========================
   PLAYER
========================= */

function drawPlayer() {

    const x =
        player.x - cameraX;


    /* BODY */

    ctx.fillStyle =
        "#d28b45";

    ctx.fillRect(
        x,
        player.y + 15,
        player.width,
        player.height - 15
    );


    ctx.strokeStyle =
        "#8b5428";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        x,
        player.y + 15,
        player.width,
        player.height - 15
    );


    /* TOP */

    ctx.fillStyle =
        "#f2bd6b";

    ctx.beginPath();

    ctx.roundRect(
        x + 2,
        player.y,
        player.width - 4,
        28,
        12
    );

    ctx.fill();


    /* FACE */

    ctx.fillStyle =
        "#222";

    ctx.beginPath();

    ctx.arc(
        x + 13,
        player.y + 13,
        3,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 29,
        player.y + 13,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* LEGS */

    ctx.fillStyle =
        "#51321c";

    ctx.fillRect(
        x + 5,
        player.y + player.height - 5,
        12,
        8
    );

    ctx.fillRect(
        x + 25,
        player.y + player.height - 5,
        12,
        8
    );

}


/* =========================
   GOAL
========================= */

function drawGoal() {

    const x =
        7480 - cameraX;


    ctx.fillStyle =
        "#70451f";

    ctx.fillRect(
        x + 18,
        390,
        8,
        130
    );


    ctx.fillStyle =
        "#ffdc45";

    ctx.beginPath();

    ctx.moveTo(
        x + 26,
        395
    );

    ctx.lineTo(
        x + 82,
        415
    );

    ctx.lineTo(
        x + 26,
        440
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#fff4a8";

    ctx.font =
        "bold 18px Arial";

    ctx.textAlign = "left";

    ctx.fillText(
        "LEVEL 6",
        x - 5,
        370
    );

}


/* =========================
   DRAW
========================= */

function draw() {

    drawBackground();

    drawPlatforms();

    drawCoins();

    drawEnemies();

    drawGoal();

    drawPlayer();

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}

updateHUD();

gameLoop();

</script>
