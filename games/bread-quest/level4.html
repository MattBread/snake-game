<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bread Quest - Level 4</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #160b05;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

h1 {
    margin: 12px 0 4px;
    color: #ff8c42;
    text-shadow: 0 0 12px #ff4500;
}

.subtitle {
    margin-bottom: 10px;
    color: #ffd166;
}

#gameContainer {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    max-width: 1100px;
    margin: 0 auto;
    background: #240b05;
    border: 3px solid #ff6b35;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(255, 69, 0, 0.6);
}

#stats {
    margin: 10px auto;
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
    font-size: 18px;
    font-weight: bold;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    margin: 5px;
    background: #ff6b35;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ff8c42;
}

#message {
    min-height: 28px;
    margin: 8px;
    font-weight: bold;
    color: #ffd166;
}

.mobileControls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 10px auto;
    flex-wrap: wrap;
}

.mobileControls button {
    width: 80px;
    height: 55px;
    font-size: 24px;
    touch-action: none;
    user-select: none;
}

.instructions {
    color: #ddd;
    font-size: 14px;
    margin: 8px;
}
</style>
</head>

<body>

<h1>🌋 The Bread Quest</h1>
<div class="subtitle">Level 4 — Crustfire Volcano</div>

<div id="stats">
    <div>❤️ Lives: <span id="lives">3</span></div>
    <div>⭐ Score: <span id="score">0</span></div>
</div>

<div id="gameContainer">
    <canvas id="game" width="1100" height="600"></canvas>
</div>

<div id="message">
    Reach the golden bread flag!
</div>

<div class="instructions">
    Arrow Keys / A-D = Move &nbsp; | &nbsp; Space / W / ↑ = Jump
</div>

<div class="mobileControls">
    <button id="leftBtn">⬅️</button>
    <button id="jumpBtn">⬆️</button>
    <button id="rightBtn">➡️</button>
</div>

<div>
    <button onclick="restartGame()">🔄 Restart</button>
    <button onclick="goLevel3()">⬅ Level 3</button>
    <button onclick="goWorldMap()">🗺️ World Map</button>
    <button onclick="goArcade()">🏠 Arcade</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const livesText = document.getElementById("lives");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

const WORLD_WIDTH = 7000;

let cameraX = 0;
let score = 0;
let lives = 3;
let gameOver = false;
let levelComplete = false;

const keys = {};

const player = {
    x: 100,
    y: 400,
    width: 42,
    height: 50,
    vx: 0,
    vy: 0,
    speed: 5,
    jumpPower: -13,
    onGround: false
};

/* =========================
   PLATFORMS
========================= */

const platforms = [
    { x: 0, y: 520, w: 700, h: 80 },

    // FIRST GAP — shortened so it is clearly jumpable
    { x: 800, y: 520, w: 650, h: 80 },

    { x: 1550, y: 520, w: 600, h: 80 },

    { x: 2250, y: 520, w: 700, h: 80 },

    { x: 3050, y: 520, w: 600, h: 80 },

    { x: 3750, y: 520, w: 750, h: 80 },

    { x: 4600, y: 520, w: 600, h: 80 },

    { x: 5300, y: 520, w: 850, h: 80 },

    { x: 6250, y: 520, w: 750, h: 80 },

    // Small elevated platforms
    { x: 1050, y: 420, w: 180, h: 25 },
    { x: 1750, y: 400, w: 180, h: 25 },
    { x: 2500, y: 400, w: 200, h: 25 },
    { x: 3300, y: 420, w: 180, h: 25 },
    { x: 4050, y: 390, w: 200, h: 25 },
    { x: 4850, y: 410, w: 200, h: 25 },
    { x: 5550, y: 390, w: 200, h: 25 }
];

/* =========================
   LAVA
========================= */

const lavaZones = [
    { x: 700, w: 100 },
    { x: 1450, w: 100 },
    { x: 2150, w: 100 },
    { x: 2950, w: 100 },
    { x: 3650, w: 100 },
    { x: 4500, w: 100 },
    { x: 5200, w: 100 },
    { x: 6150, w: 100 }
];

/* =========================
   COINS
========================= */

const coins = [
    { x: 250, y: 430, collected: false },
    { x: 400, y: 390, collected: false },
    { x: 600, y: 430, collected: false },

    { x: 900, y: 430, collected: false },
    { x: 1100, y: 360, collected: false },
    { x: 1350, y: 430, collected: false },

    { x: 1650, y: 430, collected: false },
    { x: 1800, y: 340, collected: false },
    { x: 2050, y: 430, collected: false },

    { x: 2400, y: 430, collected: false },
    { x: 2550, y: 340, collected: false },
    { x: 2850, y: 430, collected: false },

    { x: 3150, y: 430, collected: false },
    { x: 3400, y: 360, collected: false },
    { x: 3550, y: 430, collected: false },

    { x: 3850, y: 430, collected: false },
    { x: 4100, y: 330, collected: false },
    { x: 4400, y: 430, collected: false },

    { x: 4700, y: 430, collected: false },
    { x: 4900, y: 350, collected: false },
    { x: 5100, y: 430, collected: false },

    { x: 5400, y: 430, collected: false },
    { x: 5600, y: 330, collected: false },
    { x: 6000, y: 430, collected: false },

    { x: 6400, y: 430, collected: false },
    { x: 6650, y: 430, collected: false }
];

/* =========================
   ENEMIES
========================= */

const enemies = [
    {
        x: 500,
        y: 470,
        w: 40,
        h: 50,
        vx: 1.5,
        startX: 450,
        endX: 650
    },
    {
        x: 1000,
        y: 470,
        w: 40,
        h: 50,
        vx: 1.4,
        startX: 850,
        endX: 1350
    },
    {
        x: 1700,
        y: 470,
        w: 40,
        h: 50,
        vx: 1.5,
        startX: 1600,
        endX: 2050
    },
    {
        x: 2400,
        y: 470,
        w: 40,
        h: 50,
        vx: 1.7,
        startX: 2300,
        endX: 2850
    },
    {
        x: 3150,
        y: 470,
        w: 40,
        h: 50,
        vx: 1.5,
        startX: 3100,
        endX: 3550
    },
    {
        x: 3900,
        y: 470,
        w: 40,
        h: 50,
        vx: 1.8,
        startX: 3800,
        endX: 4400
    },
    {
        x: 4750,
        y: 470,
        w: 40,
        h: 50,
        vx: 1.5,
        startX: 4650,
        endX: 5100
    },
    {
        x: 5450,
        y: 470,
        w: 40,
        h: 50,
        vx: 1.8,
        startX: 5350,
        endX: 6050
    }
];

/* =========================
   GOAL
========================= */

const goal = {
    x: 6850,
    y: 390,
    w: 50,
    h: 130
};

/* =========================
   COLLISION
========================= */

function rectsCollide(a, b) {
    const aw = a.width ?? a.w;
    const ah = a.height ?? a.h;
    const bw = b.width ?? b.w;
    const bh = b.height ?? b.h;

    return (
        a.x < b.x + bw &&
        a.x + aw > b.x &&
        a.y < b.y + bh &&
        a.y + ah > b.y
    );
}

/* =========================
   RESET
========================= */

function resetPlayer() {
    player.x = 100;
    player.y = 400;
    player.vx = 0;
    player.vy = 0;
    cameraX = 0;
}

/* =========================
   RESTART
========================= */

function restartGame() {
    score = 0;
    lives = 3;
    gameOver = false;
    levelComplete = false;

    coins.forEach(coin => {
        coin.collected = false;
    });

    enemies.forEach(enemy => {
        enemy.x = enemy.startX;
        enemy.vx = Math.abs(enemy.vx);
    });

    resetPlayer();

    livesText.textContent = lives;
    scoreText.textContent = score;

    message.textContent = "Reach the golden bread flag!";
}

/* =========================
   PLAYER INPUT
========================= */

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (
        e.key === " " ||
        e.key === "ArrowUp" ||
        e.key.toLowerCase() === "w"
    ) {
        e.preventDefault();

        if (player.onGround && !gameOver && !levelComplete) {
            player.vy = player.jumpPower;
            player.onGround = false;
        }
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

/* =========================
   MOBILE CONTROLS
========================= */

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const jumpBtn = document.getElementById("jumpBtn");

leftBtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys["arrowleft"] = true;
});

leftBtn.addEventListener("pointerup", e => {
    e.preventDefault();
    keys["arrowleft"] = false;
});

leftBtn.addEventListener("pointerleave", e => {
    keys["arrowleft"] = false;
});

rightBtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys["arrowright"] = true;
});

rightBtn.addEventListener("pointerup", e => {
    e.preventDefault();
    keys["arrowright"] = false;
});

rightBtn.addEventListener("pointerleave", e => {
    keys["arrowright"] = false;
});

jumpBtn.addEventListener("pointerdown", e => {
    e.preventDefault();

    if (player.onGround && !gameOver && !levelComplete) {
        player.vy = player.jumpPower;
        player.onGround = false;
    }
});

/* =========================
   UPDATE
========================= */

function update() {

    if (gameOver || levelComplete) {
        return;
    }

    /* Horizontal movement */

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {
        player.vx = player.speed;
    } else if (
        keys["arrowleft"] ||
        keys["a"]
    ) {
        player.vx = -player.speed;
    } else {
        player.vx *= 0.8;
    }

    player.x += player.vx;

    /* Gravity */

    player.vy += 0.65;
    player.y += player.vy;

    player.onGround = false;

    /* Platform collision */

    for (const platform of platforms) {

        if (
            player.x + player.width > platform.x &&
            player.x < platform.x + platform.w &&
            player.y + player.height >= platform.y &&
            player.y + player.height <= platform.y + 25 &&
            player.vy >= 0
        ) {
            player.y = platform.y - player.height;
            player.vy = 0;
            player.onGround = true;
        }
    }

    /* World boundaries */

    if (player.x < 0) {
        player.x = 0;
    }

    if (player.x > WORLD_WIDTH - player.width) {
        player.x = WORLD_WIDTH - player.width;
    }

    /* Lava collision */

    for (const lava of lavaZones) {

        if (
            player.x + player.width > lava.x &&
            player.x < lava.x + lava.w &&
            player.y + player.height >= 520
        ) {
            loseLife();
            return;
        }
    }

    /* Falling */

    if (player.y > canvas.height + 100) {
        loseLife();
        return;
    }

    /* Coins */

    for (const coin of coins) {

        if (coin.collected) {
            continue;
        }

        const coinBox = {
            x: coin.x - 12,
            y: coin.y - 12,
            w: 24,
            h: 24
        };

        if (rectsCollide(player, coinBox)) {
            coin.collected = true;
            score += 250;
            scoreText.textContent = score;
        }
    }

    /* Enemies */

    for (const enemy of enemies) {

        enemy.x += enemy.vx;

        if (enemy.x <= enemy.startX) {
            enemy.x = enemy.startX;
            enemy.vx = Math.abs(enemy.vx);
        }

        if (enemy.x + enemy.w >= enemy.endX) {
            enemy.x = enemy.endX - enemy.w;
            enemy.vx = -Math.abs(enemy.vx);
        }

        if (rectsCollide(player, enemy)) {

            const playerBottom =
                player.y + player.height;

            const enemyTop =
                enemy.y;

            if (
                player.vy > 0 &&
                playerBottom - enemyTop < 25
            ) {
                score += 500;
                scoreText.textContent = score;

                enemy.x = -1000;

                player.vy = -9;
            } else {
                loseLife();
                return;
            }
        }
    }

    /* Goal */

    if (rectsCollide(player, goal)) {

        levelComplete = true;

        score += 1500;
        scoreText.textContent = score;

        localStorage.setItem(
            "breadQuestCompleted",
            "4"
        );

        localStorage.setItem(
            "breadQuestUnlocked",
            "5"
        );

        message.textContent =
            "🏆 LEVEL 4 COMPLETE! Crustfire Volcano conquered! Level 5 unlocked!";
    }

    /* Camera */

    cameraX =
        player.x -
        canvas.width * 0.35;

    if (cameraX < 0) {
        cameraX = 0;
    }

    if (cameraX > WORLD_WIDTH - canvas.width) {
        cameraX = WORLD_WIDTH - canvas.width;
    }
}

/* =========================
   LOSE LIFE
========================= */

function loseLife() {

    lives--;

    livesText.textContent = lives;

    if (lives <= 0) {

        gameOver = true;

        message.textContent =
            "💀 GAME OVER! Press Restart to try again.";

        return;
    }

    message.textContent =
        "🔥 Ouch! Watch the lava!";

    resetPlayer();
}

/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    gradient.addColorStop(
        0,
        "#12030b"
    );

    gradient.addColorStop(
        0.55,
        "#551000"
    );

    gradient.addColorStop(
        1,
        "#1a0500"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /* Volcanoes */

    ctx.fillStyle = "#3a1008";

    for (
        let x = -500;
        x < WORLD_WIDTH;
        x += 900
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x - cameraX,
            520
        );

        ctx.lineTo(
            x + 300 - cameraX,
            180
        );

        ctx.lineTo(
            x + 600 - cameraX,
            520
        );

        ctx.closePath();

        ctx.fill();
    }

    /* Fire glow */

    ctx.fillStyle =
        "rgba(255,80,0,0.18)";

    ctx.fillRect(
        0,
        400,
        canvas.width,
        120
    );
}

/* =========================
   DRAW LAVA
========================= */

function drawLava() {

    for (const lava of lavaZones) {

        const x =
            lava.x - cameraX;

        const gradient =
            ctx.createLinearGradient(
                x,
                520,
                x,
                600
            );

        gradient.addColorStop(
            0,
            "#ffea00"
        );

        gradient.addColorStop(
            0.3,
            "#ff6600"
        );

        gradient.addColorStop(
            1,
            "#d40000"
        );

        ctx.fillStyle = gradient;

        ctx.fillRect(
            x,
            520,
            lava.w,
            80
        );

        ctx.fillStyle =
            "#ffb000";

        for (
            let bubble = 0;
            bubble < lava.w;
            bubble += 30
        ) {

            ctx.beginPath();

            ctx.arc(
                x + bubble + 10,
                540,
                5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }
}

/* =========================
   DRAW PLATFORMS
========================= */

function drawPlatforms() {

    for (const platform of platforms) {

        const x =
            platform.x - cameraX;

        if (
            x + platform.w < 0 ||
            x > canvas.width
        ) {
            continue;
        }

        ctx.fillStyle = "#6b3515";

        ctx.fillRect(
            x,
            platform.y,
            platform.w,
            platform.h
        );

        ctx.fillStyle = "#a95420";

        ctx.fillRect(
            x,
            platform.y,
            platform.w,
            12
        );

        ctx.fillStyle = "#d66a24";

        for (
            let brick = 0;
            brick < platform.w;
            brick += 40
        ) {

            ctx.fillRect(
                x + brick,
                platform.y + 25,
                30,
                8
            );
        }
    }
}

/* =========================
   DRAW COINS
========================= */

function drawCoins() {

    for (const coin of coins) {

        if (coin.collected) {
            continue;
        }

        const x =
            coin.x - cameraX;

        if (
            x < -30 ||
            x > canvas.width + 30
        ) {
            continue;
        }

        ctx.fillStyle = "#ffd700";

        ctx.beginPath();

        ctx.arc(
            x,
            coin.y,
            12,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle =
            "#fff3a0";

        ctx.lineWidth = 3;

        ctx.stroke();

        ctx.fillStyle =
            "#ff9d00";

        ctx.font =
            "bold 14px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "★",
            x,
            coin.y
        );
    }
}

/* =========================
   DRAW ENEMIES
========================= */

function drawEnemies() {

    for (const enemy of enemies) {

        if (enemy.x < -1000) {
            continue;
        }

        const x =
            enemy.x - cameraX;

        if (
            x + enemy.w < 0 ||
            x > canvas.width
        ) {
            continue;
        }

        ctx.fillStyle =
            "#5c1a0b";

        ctx.fillRect(
            x,
            enemy.y,
            enemy.w,
            enemy.h
        );

        ctx.fillStyle =
            "#ffb000";

        ctx.beginPath();

        ctx.arc(
            x + 10,
            enemy.y + 15,
            5,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 30,
            enemy.y + 15,
            5,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle =
            "#ff4500";

        ctx.fillRect(
            x + 8,
            enemy.y + 34,
            24,
            7
        );
    }
}

/* =========================
   DRAW PLAYER
========================= */

function drawPlayer() {

    const x =
        player.x - cameraX;

    /* Body */

    ctx.fillStyle =
        "#f5c16c";

    ctx.fillRect(
        x,
        player.y,
        player.width,
        player.height
    );

    /* Bread crust */

    ctx.strokeStyle =
        "#8b4513";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        x,
        player.y,
        player.width,
        player.height
    );

    /* Face */

    ctx.fillStyle =
        "#000";

    ctx.beginPath();

    ctx.arc(
        x + 13,
        player.y + 18,
        3,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 29,
        player.y + 18,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Smile */

    ctx.strokeStyle =
        "#000";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        x + 21,
        player.y + 22,
        8,
        0,
        Math.PI
    );

    ctx.stroke();
}

/* =========================
   DRAW GOAL
========================= */

function drawGoal() {

    const x =
        goal.x - cameraX;

    ctx.fillStyle =
        "#8b4513";

    ctx.fillRect(
        x,
        goal.y,
        8,
        goal.h
    );

    ctx.fillStyle =
        "#ffd700";

    ctx.beginPath();

    ctx.moveTo(
        x + 8,
        goal.y
    );

    ctx.lineTo(
        x + 55,
        goal.y + 20
    );

    ctx.lineTo(
        x + 8,
        goal.y + 40
    );

    ctx.closePath();

    ctx.fill();

    ctx.font =
        "28px Arial";

    ctx.fillText(
        "🍞",
        x - 5,
        goal.y - 10
    );
}

/* =========================
   DRAW
========================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();
    drawLava();
    drawPlatforms();
    drawCoins();
    drawEnemies();
    drawGoal();
    drawPlayer();

    /* Level title */

    ctx.fillStyle =
        "rgba(0,0,0,0.45)";

    ctx.fillRect(
        15,
        15,
        280,
        45
    );

    ctx.fillStyle =
        "#ffd166";

    ctx.font =
        "bold 22px Arial";

    ctx.textAlign =
        "left";

    ctx.fillText(
        "🌋 CRUSTFIRE VOLCANO",
        28,
        44
    );
}

/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    update();
    draw();

    requestAnimationFrame(
        gameLoop
    );
}

/* =========================
   NAVIGATION
========================= */

function goLevel3() {

    window.location.href =
        "/snake-game/games/bread-quest/level3.html";
}

function goWorldMap() {

    window.location.href =
        "/snake-game/games/bread-quest/world-map.html";
}

function goArcade() {

    window.location.href =
        "/snake-game/";
}

/* =========================
   START
========================= */

restartGame();
gameLoop();

</script>

</body>
</html>
